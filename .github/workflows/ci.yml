name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    name: Software Factory Evals (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run deterministic eval suite
        run: node evals/run.mjs --ascii
