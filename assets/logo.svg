  <path d="M 64 84 C 76 84, 76 64, 86 64" fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round"/>
  <!-- DAG pipeline nodes -->
  <circle cx="40" cy="64" r="9" fill="url(#sf-accent)" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="64" cy="44" r="8" fill="#0EA5E9" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="64" cy="84" r="8" fill="#6366F1" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="88" cy="64" r="9" fill="#10B981" stroke="#F8FAFC" stroke-width="2.5"/>
