<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Software Factory — Live Tech-Tree View</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --bg-grid: #e2e8f0;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --border: #cbd5e1;
      --border-subtle: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;

      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-text: #1d4ed8;

      --pass-bg: #dcfce7;
      --pass-border: #16a34a;
      --pass-text: #14532d;

      --fail-bg: #fee2e2;
      --fail-border: #dc2626;
      --fail-text: #7f1d1d;

      --stale-bg: #fef3c7;
      --stale-border: #d97706;
      --stale-text: #78350f;

      --unrev-bg: #dbeafe;
      --unrev-border: #2563eb;
      --unrev-text: #1e3a8a;

      --review-bg: #f3e8ff;
      --review-border: #9333ea;
      --review-text: #581c87;

      --unlock-bg: #ccfbf1;
      --unlock-border: #0d9488;
      --unlock-text: #115e59;

      --lock-bg: #f1f5f9;
      --lock-border: #94a3b8;
      --lock-text: #475569;

      --invalid-bg: #fae8ff;
      --invalid-border: #c026d3;
      --invalid-text: #701a75;

      --edge-required: #94a3b8;
      --edge-optional: #cbd5e1;
      --edge-upstream: #0284c7;
      --edge-downstream: #7c3aed;
      --edge-blast: #ea580c;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-focus: 0 0 0 3px rgba(37, 99, 235, 0.25);

      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1120;
        --bg-grid: #1e293b;
        --surface: #111827;
        --surface-2: #1e293b;
        --surface-3: #334155;
        --border: #334155;
        --border-subtle: #1f2937;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-faint: #64748b;

        --accent: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.18);
        --accent-text: #93c5fd;

        --pass-bg: rgba(22, 163, 74, 0.2);
        --pass-border: #22c55e;
        --pass-text: #86efac;

        --fail-bg: rgba(220, 38, 38, 0.22);
        --fail-border: #ef4444;
        --fail-text: #fca5a5;

        --stale-bg: rgba(217, 119, 6, 0.22);
        --stale-border: #f59e0b;
        --stale-text: #fcd34d;

        --unrev-bg: rgba(37, 99, 235, 0.22);
        --unrev-border: #60a5fa;
        --unrev-text: #bfdbfe;

        --review-bg: rgba(147, 51, 234, 0.22);
        --review-border: #c084fc;
        --review-text: #e9d5ff;

        --unlock-bg: rgba(13, 148, 136, 0.22);
        --unlock-border: #2dd4bf;
        --unlock-text: #99f6e4;

        --lock-bg: rgba(51, 65, 85, 0.45);
        --lock-border: #475569;
        --lock-text: #94a3b8;

        --invalid-bg: rgba(192, 38, 211, 0.22);
        --invalid-border: #e879f9;
        --invalid-text: #f5d0fe;

        --edge-required: #475569;
        --edge-optional: #334155;
        --edge-upstream: #38bdf8;
        --edge-downstream: #a78bfa;
        --edge-blast: #fb923c;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
        --shadow-focus: 0 0 0 3px rgba(96, 165, 250, 0.35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1120;
      --bg-grid: #1e293b;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #334155;
      --border: #334155;
      --border-subtle: #1f2937;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;

      --accent: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --accent-text: #93c5fd;

      --pass-bg: rgba(22, 163, 74, 0.2);
      --pass-border: #22c55e;
      --pass-text: #86efac;

      --fail-bg: rgba(220, 38, 38, 0.22);
      --fail-border: #ef4444;
      --fail-text: #fca5a5;

      --stale-bg: rgba(217, 119, 6, 0.22);
      --stale-border: #f59e0b;
      --stale-text: #fcd34d;

      --unrev-bg: rgba(37, 99, 235, 0.22);
      --unrev-border: #60a5fa;
      --unrev-text: #bfdbfe;

      --review-bg: rgba(147, 51, 234, 0.22);
      --review-border: #c084fc;
      --review-text: #e9d5ff;

      --unlock-bg: rgba(13, 148, 136, 0.22);
      --unlock-border: #2dd4bf;
      --unlock-text: #99f6e4;

      --lock-bg: rgba(51, 65, 85, 0.45);
      --lock-border: #475569;
      --lock-text: #94a3b8;

      --invalid-bg: rgba(192, 38, 211, 0.22);
      --invalid-border: #e879f9;
      --invalid-text: #f5d0fe;

      --edge-required: #475569;
      --edge-optional: #334155;
      --edge-upstream: #38bdf8;
      --edge-downstream: #a78bfa;
      --edge-blast: #fb923c;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
      --shadow-focus: 0 0 0 3px rgba(96, 165, 250, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Top summary bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      border: 1px solid var(--accent);
      flex-shrink: 0;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .project-title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .project-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    /* Segmented View Switcher */
    .view-switcher {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .view-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .view-btn:hover { color: var(--text); }

    .view-btn.active {
      background: var(--surface);
      color: var(--accent-text);
      box-shadow: var(--shadow-sm);
    }

    .summary-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text);
    }

    .metric-pill.has-stale {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    .metric-pill.has-fail {
      background: var(--fail-bg);
      border-color: var(--fail-border);
      color: var(--fail-text);
    }

    .metric-pill.has-invalid {
      background: var(--invalid-bg);
      border-color: var(--invalid-border);
      color: var(--invalid-text);
    }

    .metric-pill.has-unlocked {
      background: var(--unlock-bg);
      border-color: var(--unlock-border);
      color: var(--unlock-text);
    }

    .metric-pill.has-active {
      background: var(--unrev-bg);
      border-color: var(--unrev-border);
      color: var(--unrev-text);
    }

    .progress-bar-track {
      width: 56px;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--pass-border);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Work Tech-Tree Sub-Toolbar */
    .work-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      z-index: 15;
    }

    .work-filters-left, .work-filters-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scope-select {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      max-width: 280px;
      cursor: pointer;
    }

    .filter-pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .filter-pill:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .filter-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover { background: var(--surface-2); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn:focus-visible, .filter-pill:focus-visible, .view-btn:focus-visible, .scope-select:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .btn.active-blast {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    .btn.active-toggle {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      background: var(--accent);
    }

    .sse-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .sse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
    }

    .sse-pill[data-state="connected"] {
      color: var(--pass-text);
      background: var(--pass-bg);
      border-color: var(--pass-border);
    }

    .sse-pill[data-state="connected"] .sse-dot {
      background: var(--pass-border);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
    }

    .sse-pill[data-state="reconnecting"] {
      color: var(--stale-text);
      background: var(--stale-bg);
      border-color: var(--stale-border);
    }

    .sse-pill[data-state="reconnecting"] .sse-dot {
      background: var(--stale-border);
    }

    /* Main workspace layout */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Left DAG Canvas */
    .canvas-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-grid) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .canvas-scroller {
      flex: 1;
      overflow: auto;
      position: relative;
      padding: 24px;
    }

    .dag-stage {
      position: relative;
      transform-origin: 0 0;
      transition: transform 0.15s ease;
    }

    .dag-edges-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .dag-edge {
      fill: none;
      stroke: var(--edge-required);
      stroke-width: 2;
      opacity: 0.72;
      transition: opacity 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease;
    }

    .dag-edge.kind-recommended,
    .dag-edge.kind-optional {
      stroke: var(--edge-optional);
      stroke-dasharray: 6 4;
    }

    .dag-edge.edge-skip { opacity: 0.32; }
    .dag-edge.dimmed { opacity: 0.1 !important; }

    .dag-edge.edge-upstream {
      stroke: var(--edge-upstream) !important;
      stroke-width: 2.75 !important;
      opacity: 0.98 !important;
    }

    .dag-edge.edge-downstream {
      stroke: var(--edge-downstream) !important;
      stroke-width: 2.75 !important;
      opacity: 0.98 !important;
    }

    .dag-edge.edge-blast {
      stroke: var(--edge-blast) !important;
      stroke-width: 3 !important;
      opacity: 1 !important;
    }

    .tier-header {
      position: absolute;
      top: 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 3px 10px;
      pointer-events: none;
    }

    /* Pipeline & Work Node Cards */
    .dag-node {
      position: absolute;
      width: 196px;
      min-height: 112px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }

    .dag-node.work-node {
      width: 224px;
      min-height: 112px;
      border-left-width: 5px;
    }

    .dag-node:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .dag-node:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .dag-node.optional-node { border-style: dashed; }

    /* Pipeline statuses */
    .dag-node.status-reviewed_pass { border-color: var(--pass-border); }
    .dag-node.status-reviewed_fail { border-color: var(--fail-border); }
    .dag-node.status-unreviewed { border-color: var(--unrev-border); }
    .dag-node.status-unlocked { border-color: var(--unlock-border); }
    .dag-node.status-locked { border-color: var(--lock-border); opacity: 0.78; }
    .dag-node.status-invalid { border-color: var(--invalid-border); }
    .dag-node.is-stale { border-color: var(--stale-border); }

    /* Work statuses */
    .dag-node.wstatus-done { border-color: var(--pass-border); }
    .dag-node.wstatus-in_review { border-color: var(--review-border); }
    .dag-node.wstatus-in_progress { border-color: var(--unrev-border); }
    .dag-node.wstatus-ready { border-color: var(--unlock-border); }
    .dag-node.wstatus-blocked { border-color: var(--stale-border); opacity: 0.88; }
    .dag-node.wstatus-canceled { border-color: var(--lock-border); opacity: 0.55; }

    .dag-node.selected {
      box-shadow: 0 0 0 3px var(--accent), var(--shadow-md);
      z-index: 5;
      opacity: 1;
    }

    .dag-node.dimmed { opacity: 0.25; }

    .dag-node.node-upstream {
      box-shadow: 0 0 0 2px var(--edge-upstream), var(--shadow-sm);
      opacity: 1;
    }

    .dag-node.node-downstream {
      box-shadow: 0 0 0 2px var(--edge-downstream), var(--shadow-sm);
      opacity: 1;
    }

    .dag-node.node-blast {
      box-shadow: 0 0 0 3px var(--edge-blast), var(--shadow-md);
      opacity: 1;
    }

    .node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .node-stage-tag {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .node-skill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }

    .work-title {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .node-file {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .badge-pass { background: var(--pass-bg); color: var(--pass-text); border-color: var(--pass-border); }
    .badge-fail { background: var(--fail-bg); color: var(--fail-text); border-color: var(--fail-border); }
    .badge-stale { background: var(--stale-bg); color: var(--stale-text); border-color: var(--stale-border); }
    .badge-unreviewed { background: var(--unrev-bg); color: var(--unrev-text); border-color: var(--unrev-border); }
    .badge-review { background: var(--review-bg); color: var(--review-text); border-color: var(--review-border); }
    .badge-unlocked { background: var(--unlock-bg); color: var(--unlock-text); border-color: var(--unlock-border); }
    .badge-locked { background: var(--lock-bg); color: var(--lock-text); border-color: var(--lock-border); }
    .badge-invalid { background: var(--invalid-bg); color: var(--invalid-text); border-color: var(--invalid-border); }
    .badge-neutral { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }

    .work-empty-canvas {
      max-width: 480px;
      margin: 48px auto;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .work-empty-canvas h3 { margin: 0; font-size: 15px; }
    .work-empty-canvas p { margin: 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

    /* Canvas footer controls & legend */
    .canvas-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-items {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-line {
      width: 18px;
      height: 0;
      border-top: 2px solid var(--edge-required);
    }

    .legend-line.dashed {
      border-top-style: dashed;
      border-top-color: var(--text-faint);
    }

    .legend-line.cp {
      border-top: 3px solid var(--edge-blast);
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Side Inspector Drawer */
    .inspector {
      width: 440px;
      max-width: 46vw;
      min-width: 330px;
      background: var(--surface);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 10;
    }

    .inspector-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inspector-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .inspector-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .inspector-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .inspector-actions-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Copy Prompt Action Card */
    .prompt-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prompt-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .prompt-box-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .prompt-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      font-family: var(--font-mono);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    /* Inspector Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 12px;
      gap: 4px;
      background: var(--surface);
    }

    .tab-btn {
      padding: 9px 12px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      color: var(--accent-text);
      border-bottom-color: var(--accent);
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .alert-card {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.45;
    }

    .alert-card h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; }
    .alert-card ul { margin: 0; padding-left: 18px; }

    .alert-card.alert-error {
      background: var(--fail-bg);
      border-color: var(--fail-border);
      color: var(--fail-text);
    }

    .alert-card.alert-stale, .alert-card.alert-warn {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    /* Structured State Cards & Work Metadata Grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kv-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
    }

    .kv-key {
      font-size: 10.5px;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kv-value {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }

    .kv-value ul { margin: 0; padding-left: 18px; }

    .kv-pre {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11.5px;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 8px;
      overflow-x: auto;
    }

    .jump-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .jump-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .jump-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .jump-btn-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    details.raw-json-details {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 8px 10px;
    }

    details.raw-json-details summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Mockery Extras Panel */
    .mockery-card {
      background: var(--surface-2);
      border: 1px dashed var(--accent);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mockery-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mockery-stat {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
    }

    .mockery-stat-val { font-size: 15px; font-weight: 700; }
    .mockery-stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

    .cmd-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cmd-code {
      flex: 1;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 10.5px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      padding: 5px 7px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .cmd-row .btn { padding: 5px 8px; white-space: nowrap; flex-shrink: 0; }

    .preview-input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
    }

    /* Safe Narrative Markdown Styling */
    .md-view { font-size: 13px; line-height: 1.6; color: var(--text); }
    .md-view h1, .md-view h2, .md-view h3, .md-view h4 { margin: 14px 0 6px; line-height: 1.3; }
    .md-view h1 { font-size: 17px; }
    .md-view h2 { font-size: 15px; }
    .md-view h3 { font-size: 13.5px; }
    .md-view h4 { font-size: 12.5px; }
    .md-view p { margin: 0 0 10px; }
    .md-view ul, .md-view ol { margin: 0 0 10px; padding-left: 20px; }
    .md-view li { margin-bottom: 4px; }
    .md-view blockquote {
      margin: 0 0 10px;
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .md-view code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--surface-2);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .md-view pre {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 0 0 10px;
    }
    .md-view pre code { background: transparent; padding: 0; }
    .md-view table { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: 12px; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
    .md-view th { background: var(--surface-2); font-weight: 700; }
    .md-view a { color: var(--accent-text); text-decoration: underline; }
    .md-view hr { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 0; }

    /* Reviews List */
    .review-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .review-meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .empty-note {
      color: var(--text-muted);
      font-size: 12.5px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--text);
      color: var(--surface);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 960px) {
      .workspace { flex-direction: column; }
      .inspector {
        width: 100%;
        max-width: 100%;
        height: 46vh;
        border-left: none;
        border-top: 1px solid var(--border-subtle);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark" aria-hidden="true">SF</div>
        <div class="project-meta">
          <div id="project-name" class="project-title">Loading…</div>
          <div id="workspace-root" class="project-sub">sf-tree</div>
        </div>
        <div class="view-switcher" role="tablist" aria-label="View Mode">
          <button type="button" id="btn-view-work" class="view-btn" role="tab" aria-selected="false">Work Tech-Tree</button>
          <button type="button" id="btn-view-pipeline" class="view-btn active" role="tab" aria-selected="true">Pipeline Stages</button>
        </div>
      </div>

      <!-- Pipeline Summary Metrics -->
      <div class="summary-metrics" id="pipeline-metrics">
        <span class="metric-pill" id="metric-core">
          <span id="metric-core-text">0/8 Core</span>
          <span class="progress-bar-track"><span id="metric-core-fill" class="progress-bar-fill" style="width:0%"></span></span>
        </span>
        <span class="metric-pill" id="metric-unlocked">Unlocked: 0</span>
        <span class="metric-pill" id="metric-stale">Stale: 0</span>
        <span class="metric-pill" id="metric-fail">Failing: 0</span>
        <span class="metric-pill" id="metric-invalid" style="display:none">Invalid: 0</span>
      </div>

      <!-- Work Tech-Tree Summary Metrics -->
      <div class="summary-metrics hidden" id="work-metrics">
        <span class="metric-pill" id="wmetric-done">
          <span id="wmetric-done-text">0/0 Done</span>
          <span class="progress-bar-track"><span id="wmetric-done-fill" class="progress-bar-fill" style="width:0%"></span></span>
        </span>
        <span class="metric-pill" id="wmetric-ready">Ready: 0</span>
        <span class="metric-pill" id="wmetric-active">Active: 0</span>
        <span class="metric-pill" id="wmetric-blocked">Blocked: 0</span>
        <span class="metric-pill" id="wmetric-cp">Critical Path: 0 pts</span>
      </div>

      <div class="toolbar-controls">
        <!-- Pipeline-only controls -->
        <button type="button" id="btn-toggle-mockery" class="btn active-toggle" aria-pressed="true">Show Mockery (6b)</button>
        <button type="button" id="btn-toggle-blast" class="btn" aria-pressed="false">Highlight Stale Blast Radius</button>

        <!-- Work-only controls -->
        <button type="button" id="btn-toggle-cp" class="btn hidden" aria-pressed="false">Highlight Critical Path</button>
        <button type="button" id="btn-work-refresh" class="btn hidden">Refresh</button>

        <button type="button" id="btn-theme" class="btn" title="Toggle light/dark theme">Theme</button>
        <span id="sse-pill" class="sse-pill" data-state="reconnecting" role="status" aria-live="polite">
          <span class="sse-dot"></span>
          <span id="sse-label">Connecting…</span>
        </span>
      </div>
    </header>

    <!-- Work Tech-Tree Filter Bar -->
    <div id="work-subbar" class="work-subbar hidden" aria-label="Work Tech-Tree Filters">
      <div class="work-filters-left">
        <label for="scope-select" class="inspector-sub">Scope:</label>
        <select id="scope-select" class="scope-select" aria-label="Filter by Project or Milestone">
          <option value="all">All Active Projects</option>
        </select>

        <button type="button" class="filter-pill active" data-wfilter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-pill" data-wfilter="ready" aria-pressed="false">Ready to Start</button>
        <button type="button" class="filter-pill" data-wfilter="active" aria-pressed="false">In Progress</button>
        <button type="button" class="filter-pill" data-wfilter="blocked" aria-pressed="false">Blocked</button>
        <button type="button" id="btn-hide-done" class="filter-pill" aria-pressed="false">Hide Done</button>
      </div>
      <div class="work-filters-right">
        <span id="work-scope-points" class="inspector-sub"></span>
      </div>
    </div>

    <main class="workspace">
      <section class="canvas-pane" aria-label="Interactive Tech-Tree DAG">
        <div id="canvas-scroller" class="canvas-scroller">
          <div id="dag-stage" class="dag-stage">
            <svg id="dag-edges" class="dag-edges-svg" aria-hidden="true"></svg>
            <div id="dag-nodes"></div>
          </div>
          <div id="work-empty-host"></div>
        </div>
        <div class="canvas-footer">
          <div class="legend-items" id="legend-items"></div>
          <div class="zoom-controls">
            <button type="button" id="btn-zoom-out" class="btn" aria-label="Zoom out">-</button>
            <button type="button" id="btn-zoom-fit" class="btn">Fit</button>
            <button type="button" id="btn-zoom-reset" class="btn">100%</button>
            <button type="button" id="btn-zoom-in" class="btn" aria-label="Zoom in">+</button>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-label="Inspector Drawer">
        <div class="inspector-header" id="inspector-header"></div>
        <div class="tab-bar" id="pipeline-tab-bar" role="tablist">
          <button type="button" class="tab-btn active" role="tab" data-tab="overview" aria-selected="true">Overview / &lt;system_state&gt;</button>
          <button type="button" class="tab-btn" role="tab" data-tab="narrative" aria-selected="false">Narrative</button>
          <button type="button" class="tab-btn" role="tab" data-tab="reviews" aria-selected="false" id="tab-btn-reviews">Reviews</button>
        </div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      // Pipeline layout constants
      const P_NODE_W = 196;
      const P_NODE_H = 114;
      const P_COL_GAP = 40;
      const P_PAD_X = 24;
      const P_PAD_Y = 74;
      const P_ROW_GAP = 72;

      const PIPELINE_LAYOUT = {
        vision: { col: 0, row: 0 },
        "market-research": { col: 1, row: 0 },
        brd: { col: 2, row: 0 },
        prd: { col: 3, row: 0 },
        ux: { col: 4, row: 0 },
        ui: { col: 5, row: 0 },
        mockery: { col: 5, row: 1 },
        architecture: { col: 6, row: 0 },
        specs: { col: 7, row: 0 },
      };

      // Work Tech-Tree layout constants
      const W_NODE_W = 224;
      const W_NODE_H = 114;
      const W_COL_GAP = 56;
      const W_ROW_GAP = 22;
      const W_PAD_X = 28;
      const W_PAD_Y = 52;

      const PRIORITY_NAMES = {
        0: "None",
        1: "Urgent",
        2: "High",
        3: "Medium",
        4: "Low",
      };

      const state = {
        viewMode: "pipeline", // "work" | "pipeline"
        userPickedView: false,

        // Pipeline state
        graph: null,
        selectedPhase: null,
        hoveredPhase: null,
        activeTab: "overview",
        showMockery: true,
        highlightBlast: false,
        artifactCache: new Map(),
        reviewCache: new Map(),
        expandedReviews: new Set(),
        mockeryPreviewUrl:
          safeStorageGet("sf-tree-mockery-url") || "http://127.0.0.1:4174",

        // Work Tech-Tree state
        workEnvelope: null, // { available, default_view, graph, error? }
        selectedWorkId: null,
        hoveredWorkId: null,
        workScope: "all", // "all" | "project:<id>" | "milestone:<id>"
        workFilter: "all", // "all" | "ready" | "active" | "blocked"
        hideDone: false,
        highlightCriticalPath: false,
        workRects: new Map(),

        zoom: 1,
      };

      const els = {
        projectName: document.getElementById("project-name"),
        workspaceRoot: document.getElementById("workspace-root"),
        btnViewWork: document.getElementById("btn-view-work"),
        btnViewPipeline: document.getElementById("btn-view-pipeline"),

        pipelineMetrics: document.getElementById("pipeline-metrics"),
        metricCoreText: document.getElementById("metric-core-text"),
        metricCoreFill: document.getElementById("metric-core-fill"),
        metricUnlocked: document.getElementById("metric-unlocked"),
        metricStale: document.getElementById("metric-stale"),
        metricFail: document.getElementById("metric-fail"),
        metricInvalid: document.getElementById("metric-invalid"),

        workMetrics: document.getElementById("work-metrics"),
        wmetricDoneText: document.getElementById("wmetric-done-text"),
        wmetricDoneFill: document.getElementById("wmetric-done-fill"),
        wmetricReady: document.getElementById("wmetric-ready"),
        wmetricActive: document.getElementById("wmetric-active"),
        wmetricBlocked: document.getElementById("wmetric-blocked"),
        wmetricCp: document.getElementById("wmetric-cp"),

        btnMockery: document.getElementById("btn-toggle-mockery"),
        btnBlast: document.getElementById("btn-toggle-blast"),
        btnCp: document.getElementById("btn-toggle-cp"),
        btnWorkRefresh: document.getElementById("btn-work-refresh"),
        btnTheme: document.getElementById("btn-theme"),
        ssePill: document.getElementById("sse-pill"),
        sseLabel: document.getElementById("sse-label"),

        workSubbar: document.getElementById("work-subbar"),
        scopeSelect: document.getElementById("scope-select"),
        btnHideDone: document.getElementById("btn-hide-done"),
        workScopePoints: document.getElementById("work-scope-points"),

        canvasScroller: document.getElementById("canvas-scroller"),
        dagStage: document.getElementById("dag-stage"),
        dagEdges: document.getElementById("dag-edges"),
        dagNodes: document.getElementById("dag-nodes"),
        workEmptyHost: document.getElementById("work-empty-host"),
        legendItems: document.getElementById("legend-items"),

        inspectorHeader: document.getElementById("inspector-header"),
        pipelineTabBar: document.getElementById("pipeline-tab-bar"),
        inspectorBody: document.getElementById("inspector-body"),
        tabBtnReviews: document.getElementById("tab-btn-reviews"),
        toast: document.getElementById("toast"),
      };

      function safeStorageGet(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      }
      function safeStorageSet(key, val) {
        try { localStorage.setItem(key, val); } catch {}
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function sanitizeExternalHttpsUrl(urlStr) {
        if (typeof urlStr !== "string" || !urlStr.trim()) return null;
        try {
          const u = new URL(urlStr.trim());
          if (u.protocol === "https:") return u.href;
        } catch {}
        return null;
      }

      function sanitizePreviewUrl(urlStr) {
        try {
          const u = new URL(urlStr);
          if (
            (u.protocol === "http:" || u.protocol === "https:") &&
            (u.hostname === "127.0.0.1" || u.hostname === "localhost")
          ) {
            return u.href;
          }
        } catch {}
        return null;
      }

      // Theme initialization
      function initTheme() {
        const saved = safeStorageGet("sf-tree-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
        updateThemeButton();
      }

      function isDarkEffective() {
        const attr = document.documentElement.getAttribute("data-theme");
        if (attr === "dark") return true;
        if (attr === "light") return false;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function updateThemeButton() {
        els.btnTheme.textContent = isDarkEffective() ? "Light Mode" : "Dark Mode";
      }

      els.btnTheme.addEventListener("click", () => {
        const next = isDarkEffective() ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        safeStorageSet("sf-tree-theme", next);
        updateThemeButton();
      });

      // Toast helper
      let toastTimer = null;
      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add("visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toast.classList.remove("visible");
        }, 2200);
      }

      async function copyText(text, label) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          showToast(label || "Copied to clipboard");
        } catch {
          showToast("Copy failed — select text manually");
        }
      }

      // Safe DOM-only Markdown Renderer (zero innerHTML)
      function renderSafeInline(container, text) {
        const tokenRe = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[([^\]]+)\]\(((?:[^()]+|\([^()]*\))+)\))/g;
        let lastIdx = 0;
        let match;

        while ((match = tokenRe.exec(text)) !== null) {
          if (match.index > lastIdx) {
            container.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
          }
          const tok = match[0];
          if (tok.startsWith("`")) {
            container.appendChild(el("code", "", tok.slice(1, -1)));
          } else if (tok.startsWith("**")) {
            container.appendChild(el("strong", "", tok.slice(2, -2)));
          } else if (tok.startsWith("*")) {
            container.appendChild(el("em", "", tok.slice(1, -1)));
          } else if (tok.startsWith("[")) {
            const linkText = match[2];
            const rawHref = match[3].trim().replace(/^<|>$/g, "");
            let safeHref = null;
            try {
              const parsed = new URL(rawHref);
              if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                safeHref = parsed.href;
              }
            } catch {}
            if (safeHref) {
              const a = el("a", "", linkText);
              a.href = safeHref;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              container.appendChild(a);
            } else {
              container.appendChild(document.createTextNode(linkText));
            }
          }
          lastIdx = tokenRe.lastIndex;
        }

        if (lastIdx < text.length) {
          container.appendChild(document.createTextNode(text.slice(lastIdx)));
        }
      }

      function renderSafeMarkdown(markdown) {
        const root = el("div", "md-view");
        const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) { i += 1; continue; }

          if (line.trim().startsWith("```")) {
            const codeLines = [];
            i += 1;
            while (i < lines.length && !lines[i].trim().startsWith("```")) {
              codeLines.push(lines[i]);
              i += 1;
            }
            if (i < lines.length) i += 1;
            const pre = el("pre");
            pre.appendChild(el("code", "", codeLines.join("\n")));
            root.appendChild(pre);
            continue;
          }

          if (/^(\s*[-*_]\s*){3,}$/.test(line)) {
            root.appendChild(el("hr"));
            i += 1;
            continue;
          }

          const hMatch = line.match(/^(#{1,4})\s+(.*)$/);
          if (hMatch) {
            const hEl = el(`h${hMatch[1].length}`);
            renderSafeInline(hEl, hMatch[2].trim());
            root.appendChild(hEl);
            i += 1;
            continue;
          }

          if (line.trim().startsWith(">")) {
            const bq = el("blockquote");
            const bqLines = [];
            while (i < lines.length && lines[i].trim().startsWith(">")) {
              bqLines.push(lines[i].trim().replace(/^>\s?/, ""));
              i += 1;
            }
            const p = el("p");
            renderSafeInline(p, bqLines.join(" "));
            bq.appendChild(p);
            root.appendChild(bq);
            continue;
          }

          if (
            line.includes("|") &&
            i + 1 < lines.length &&
            /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])
          ) {
            const parseRow = (r) =>
              r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
            const headers = parseRow(line);
            i += 2;
            const table = el("table");
            const thead = el("thead");
            const hTr = el("tr");
            headers.forEach((h) => {
              const th = el("th");
              renderSafeInline(th, h);
              hTr.appendChild(th);
            });
            thead.appendChild(hTr);
            table.appendChild(thead);

            const tbody = el("tbody");
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              const cells = parseRow(lines[i]);
              const tr = el("tr");
              cells.forEach((c) => {
                const td = el("td");
                renderSafeInline(td, c);
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
              i += 1;
            }
            table.appendChild(tbody);
            root.appendChild(table);
            continue;
          }

          if (/^\s*[-*+]\s+/.test(line)) {
            const ul = el("ul");
            while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
              const li = el("li");
              renderSafeInline(li, lines[i].replace(/^\s*[-*+]\s+/, ""));
              ul.appendChild(li);
              i += 1;
            }
            root.appendChild(ul);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            const ol = el("ol");
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              const li = el("li");
              renderSafeInline(li, lines[i].replace(/^\s*\d+\.\s+/, ""));
              ol.appendChild(li);
              i += 1;
            }
            root.appendChild(ol);
            continue;
          }

          const pLines = [];
          while (
            i < lines.length &&
            lines[i].trim() &&
            !lines[i].trim().startsWith("```") &&
            !/^(#{1,4})\s+/.test(lines[i]) &&
            !lines[i].trim().startsWith(">") &&
            !/^\s*[-*+]\s+/.test(lines[i]) &&
            !/^\s*\d+\.\s+/.test(lines[i])
          ) {
            pLines.push(lines[i].trim());
            i += 1;
          }
          const p = el("p");
          renderSafeInline(p, pLines.join(" "));
          root.appendChild(p);
        }

        return root;
      }

      // View Switching

        state.viewMode = mode === "work" ? "work" : "pipeline";

        els.btnViewWork.setAttribute("aria-selected", String(isWork));
        els.btnViewPipeline.classList.toggle("active", !isWork);
        els.btnViewPipeline.setAttribute("aria-selected", String(!isWork));

        els.pipelineMetrics.classList.toggle("hidden", isWork);
        els.workMetrics.classList.toggle("hidden", !isWork);
        els.btnMockery.classList.toggle("hidden", isWork);
        els.btnBlast.classList.toggle("hidden", isWork);
        els.btnCp.classList.toggle("hidden", !isWork);
        els.workSubbar.classList.toggle("hidden", !isWork);
        els.pipelineTabBar.classList.toggle("hidden", isWork);

        updateWorkRefreshVisibility();

        renderActiveView({ preserveScroll: false });

          requestAnimationFrame(() => fitZoom());

        [
          ["badge-pass", "PASS"],

          ["badge-unlocked", "UNLOCKED"],
          ["badge-locked", "LOCKED"],
        ].forEach(([cls, txt]) => {

      function renderActiveView({ preserveScroll = true } = {}) {
        if (state.viewMode === "work") {
          renderWorkSummary();
          renderWorkDag();
          renderWorkInspector({ preserveScroll });
        } else {
          els.workEmptyHost.textContent = "";
          els.dagStage.classList.remove("hidden");
          renderPipelineSummary();
          renderPipelineDag();

      // =========================================================================
      // WORK TECH-TREE VIEW
      // =========================================================================
      function workBadgeForStatus(techStatus) {
        switch (techStatus) {
          case "done": return { text: "DONE", cls: "badge-pass" };
          case "in_review": return { text: "IN REVIEW", cls: "badge-review" };
          case "in_progress": return { text: "IN PROGRESS", cls: "badge-unreviewed" };
          case "ready": return { text: "READY", cls: "badge-unlocked" };
          case "blocked": return { text: "BLOCKED", cls: "badge-stale" };
          case "canceled": return { text: "CANCELED", cls: "badge-locked" };
          default: return { text: String(techStatus || "OPEN").toUpperCase(), cls: "badge-neutral" };
        }
      }

      function workPromptLabel(item) {
        switch (item.tech_status) {
          case "ready": return "Start Ready Ticket";
          case "blocked": return "Unblock Prerequisites";
          case "in_review": return "Verify & Merge PR";
          case "in_progress": return "Continue Implementation";
          case "done": return "Downstream Next Work";
          default: return "Ticket Action Prompt";
        }
      }

      function populateScopeDropdown(wg) {
        const prev = state.workScope;
        els.scopeSelect.textContent = "";
        const optAll = el("option", "", "All Active Projects");
        optAll.value = "all";
        els.scopeSelect.appendChild(optAll);

        const projects = wg.projects || [];
        const milestones = wg.milestones || [];
        const msByProj = new Map();
        for (const m of milestones) {
          const pid = m.project_id || "__none__";
          if (!msByProj.has(pid)) msByProj.set(pid, []);
          msByProj.get(pid).push(m);
        }

        const validValues = new Set(["all"]);
        for (const p of projects) {
          const pOpt = el("option", "", `Project: ${p.name}`);
          pOpt.value = `project:${p.id}`;
          validValues.add(pOpt.value);
          els.scopeSelect.appendChild(pOpt);

          const pMs = msByProj.get(p.id) || [];
          for (const m of pMs) {
            const mOpt = el("option", "", `  ↳ ${p.name} — ${m.name}`);
            mOpt.value = `milestone:${m.id}`;
            validValues.add(mOpt.value);
            els.scopeSelect.appendChild(mOpt);
          }
        }

        state.workScope = validValues.has(prev) ? prev : "all";
        els.scopeSelect.value = state.workScope;
      }

      function getFilteredWorkItems() {
        const wg = state.workEnvelope?.graph;
        if (!wg) return [];
        return (wg.items || []).filter((item) => {
          if (state.workScope.startsWith("project:")) {
            const pid = state.workScope.slice("project:".length);
            if (item.project_id !== pid) return false;
          } else if (state.workScope.startsWith("milestone:")) {
            const mid = state.workScope.slice("milestone:".length);
            if (item.milestone_id !== mid) return false;
          }

          if (state.hideDone && (item.tech_status === "done" || item.tech_status === "canceled")) {
            return false;
          }

          if (state.workFilter === "ready" && item.tech_status !== "ready") return false;
          if (
            state.workFilter === "active" &&
            item.tech_status !== "in_progress" &&
            item.tech_status !== "in_review"
          ) {
            return false;
          }
          if (state.workFilter === "blocked" && item.tech_status !== "blocked") return false;
          return true;
        });
      }

      function computeWorkAncestorsAndDescendants(focusId, edges) {
        const up = new Set();
        const down = new Set();
        if (!focusId) return { up, down };

        const qUp = [focusId];
        while (qUp.length) {
          const cur = qUp.shift();
          for (const e of edges) {
            if (e.to === cur && !up.has(e.from) && e.from !== focusId) {
              up.add(e.from);
              qUp.push(e.from);
            }
          }
        }

        const qDown = [focusId];
        while (qDown.length) {
          const cur = qDown.shift();
          for (const e of edges) {
            if (e.from === cur && !down.has(e.to) && e.to !== focusId) {
              down.add(e.to);
              qDown.push(e.to);
            }
          }
        }
        return { up, down };
      }

      function renderWorkSummary() {
        const env = state.workEnvelope;
        const wg = env?.graph;
        if (!wg) {
          els.projectName.textContent = "Work Tech-Tree";
          els.workspaceRoot.textContent = env?.error ? "work-graph error" : "no work-graph configured";
          els.wmetricDoneText.textContent = "0/0 Done";
          els.wmetricDoneFill.style.width = "0%";
          els.wmetricReady.textContent = "Ready: 0";
          els.wmetricActive.textContent = "Active: 0";
          els.wmetricBlocked.textContent = "Blocked: 0";
          els.wmetricCp.textContent = "Critical Path: 0 pts";
          els.workScopePoints.textContent = "";
          return;
        }

        const src = wg.source || {};
        els.projectName.textContent = src.team
          ? `${src.workspace || "Linear"} (${src.team})`
          : src.workspace || "Work Tech-Tree";
        els.workspaceRoot.textContent = `source: ${src.kind || "local_file"}`;
        els.workspaceRoot.title = src.refreshed_at ? `Refreshed: ${src.refreshed_at}` : "";

        // Compute metrics for current scope (project/milestone) so dropdown reflects real progress
        const scopedAll = (wg.items || []).filter((item) => {
          if (state.workScope.startsWith("project:")) {
            return item.project_id === state.workScope.slice("project:".length);
          }
          if (state.workScope.startsWith("milestone:")) {
            return item.milestone_id === state.workScope.slice("milestone:".length);
          }
          return true;
        });

        let done = 0;
        let ready = 0;
        let active = 0;
        let blocked = 0;
        let totalPts = 0;
        let donePts = 0;
        for (const it of scopedAll) {
          if (it.tech_status === "done") done += 1;
          else if (it.tech_status === "ready") ready += 1;
          else if (it.tech_status === "in_progress" || it.tech_status === "in_review") active += 1;
          else if (it.tech_status === "blocked") blocked += 1;
          if (it.tech_status !== "canceled" && typeof it.estimate === "number") {
            totalPts += it.estimate;
            if (it.tech_status === "done") donePts += it.estimate;
          }
        }
        const nonCanceled = scopedAll.filter((it) => it.tech_status !== "canceled").length;
        const pct = nonCanceled > 0 ? Math.round((done / nonCanceled) * 100) : 0;

        els.wmetricDoneText.textContent = `${done}/${nonCanceled} Done`;
        els.wmetricDoneFill.style.width = `${pct}%`;

        els.wmetricReady.textContent = `Ready: ${ready}`;
        els.wmetricReady.classList.toggle("has-unlocked", ready > 0);

        els.wmetricActive.textContent = `Active: ${active}`;
        els.wmetricActive.classList.toggle("has-active", active > 0);

        els.wmetricBlocked.textContent = `Blocked: ${blocked}`;
        els.wmetricBlocked.classList.toggle("has-stale", blocked > 0);

        const cpPts = wg.summary?.critical_path_points ?? 0;
        els.wmetricCp.textContent = `Critical Path: ${cpPts} pts`;
        els.wmetricCp.classList.toggle("has-stale", cpPts > 0);

        els.workScopePoints.textContent = `Points: ${donePts}/${totalPts} completed (${Math.max(0, totalPts - donePts)} rem)`;
      }

      function renderWorkDag() {
        const env = state.workEnvelope;
        const wg = env?.graph;
        els.workEmptyHost.textContent = "";

        if (!wg) {
          els.dagStage.classList.add("hidden");
          const box = el("div", "work-empty-canvas");
          box.appendChild(el("h3", "", env?.error ? "Failed to Load Work-Graph" : "No Work-Graph Configured"));
          box.appendChild(
            el(
              "p",
              "",
              env?.error
                ? env.error
                : "Start sf-tree with --work-graph <snapshot.json> (via Linear MCP) or --linear-team / --linear-project (with LINEAR_API_KEY) to visualize ticket dependencies and Critical Path."
            )
          );
          const switchBtn = el("button", "btn btn-primary", "Switch to Pipeline Stages");
          switchBtn.type = "button";
          switchBtn.addEventListener("click", () => setViewMode("pipeline", { fromUser: true, autoFit: true }));
          box.appendChild(switchBtn);
          els.workEmptyHost.appendChild(box);
          return;
        }

        const visibleItems = getFilteredWorkItems();
        if (visibleItems.length === 0) {
          els.dagStage.classList.add("hidden");
          const box = el("div", "work-empty-canvas");
          box.appendChild(el("h3", "", "No matching tickets"));
          box.appendChild(el("p", "", "Adjust the Project/Milestone scope or Quick Filter pills above to see work items."));
          const resetBtn = el("button", "btn", "Reset Filters");
          resetBtn.type = "button";
          resetBtn.addEventListener("click", () => {
            state.workScope = "all";
            state.workFilter = "all";
            state.hideDone = false;
            els.scopeSelect.value = "all";
            syncWorkFilterButtons();
            renderActiveView({ preserveScroll: false });
            requestAnimationFrame(() => fitZoom());
          });
          box.appendChild(resetBtn);
          els.workEmptyHost.appendChild(box);
          return;
        }

        els.dagStage.classList.remove("hidden");
        const visibleIds = new Set(visibleItems.map((it) => it.id));
        const visibleEdges = (wg.edges || []).filter(
          (e) => visibleIds.has(e.from) && visibleIds.has(e.to)
        );

        const projectById = new Map((wg.projects || []).map((p) => [p.id, p]));
        const milestoneById = new Map((wg.milestones || []).map((m) => [m.id, m]));

        // Group visible items by tier and compress empty tier gaps for crisp rendering
        const tierGroups = new Map();
        for (const item of visibleItems) {
          const t = typeof item.tier === "number" ? item.tier : 0;
          if (!tierGroups.has(t)) tierGroups.set(t, []);
          tierGroups.get(t).push(item);
        }
        const sortedTiers = [...tierGroups.keys()].sort((a, b) => a - b);

        state.workRects = new Map();
        let maxRows = 1;
        sortedTiers.forEach((tierNum, colIdx) => {
          const group = tierGroups.get(tierNum);
          if (group.length > maxRows) maxRows = group.length;
          group.forEach((item, rowIdx) => {
            const x = W_PAD_X + colIdx * (W_NODE_W + W_COL_GAP);
            const y = W_PAD_Y + rowIdx * (W_NODE_H + W_ROW_GAP);
            state.workRects.set(item.id, { x, y, w: W_NODE_W, h: W_NODE_H, col: colIdx, row: rowIdx, tier: tierNum });
          });
        });

        const stageW = W_PAD_X * 2 + sortedTiers.length * W_NODE_W + Math.max(0, sortedTiers.length - 1) * W_COL_GAP;
        const stageH = W_PAD_Y + maxRows * W_NODE_H + Math.max(0, maxRows - 1) * W_ROW_GAP + 48;

        els.dagStage.style.width = `${stageW}px`;
        els.dagStage.style.height = `${stageH}px`;
        els.dagStage.style.transform = `scale(${state.zoom})`;

        els.dagEdges.setAttribute("width", String(stageW));
        els.dagEdges.setAttribute("height", String(stageH));
        els.dagEdges.setAttribute("viewBox", `0 0 ${stageW} ${stageH}`);
        els.dagEdges.textContent = "";

        const focusId = state.hoveredWorkId || state.selectedWorkId;
        const { up, down } = computeWorkAncestorsAndDescendants(focusId, visibleEdges);

        const cpIds = wg.summary?.critical_path_ids || [];
        const cpNodeSet = new Set(cpIds);
        const cpEdgeSet = new Set();
        for (let i = 0; i < cpIds.length - 1; i += 1) {
          cpEdgeSet.add(`${cpIds[i]}\u0000${cpIds[i + 1]}`);
        }

        // SVG arrowhead markers
        const svgNS = "http://www.w3.org/2000/svg";
        const defs = document.createElementNS(svgNS, "defs");
        [
          { id: "warr-default", color: "var(--edge-required)" },
          { id: "warr-up", color: "var(--edge-upstream)" },
          { id: "warr-down", color: "var(--edge-downstream)" },
          { id: "warr-cp", color: "var(--edge-blast)" },
        ].forEach((m) => {
          const marker = document.createElementNS(svgNS, "marker");
          marker.setAttribute("id", m.id);
          marker.setAttribute("markerWidth", "8");
          marker.setAttribute("markerHeight", "8");
          marker.setAttribute("refX", "7");
          marker.setAttribute("refY", "4");
          marker.setAttribute("orient", "auto");
          const poly = document.createElementNS(svgNS, "polygon");
          poly.setAttribute("points", "0 1, 8 4, 0 7");
          poly.setAttribute("fill", m.color);
          marker.appendChild(poly);
          defs.appendChild(marker);
        });
        els.dagEdges.appendChild(defs);

        // Render SVG cubic Bezier edges
        for (const edge of visibleEdges) {
          const a = state.workRects.get(edge.from);
          const b = state.workRects.get(edge.to);
          if (!a || !b) continue;

          const x1 = a.x + a.w;
          const y1 = a.y + a.h / 2;
          const x2 = b.x - 2;
          const y2 = b.y + b.h / 2;
          const dx = Math.max(36, Math.abs(x2 - x1) * 0.45);
          const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

          const pathEl = document.createElementNS(svgNS, "path");
          pathEl.setAttribute("d", d);
          const classes = ["dag-edge"];
          let markerId = "warr-default";

          if (state.highlightCriticalPath) {
            if (cpEdgeSet.has(`${edge.from}\u0000${edge.to}`)) {
              classes.push("edge-blast");
              markerId = "warr-cp";
            } else {
              classes.push("dimmed");
            }
          } else if (focusId && visibleIds.has(focusId)) {
            const isUpEdge =
              (edge.to === focusId || up.has(edge.to)) &&
              (up.has(edge.from) || edge.from === focusId) &&
              edge.from !== focusId;
            const isDownEdge =
              (edge.from === focusId || down.has(edge.from)) &&
              (down.has(edge.to) || edge.to === focusId) &&
              edge.to !== focusId;
            if (isUpEdge) {
              classes.push("edge-upstream");
              markerId = "warr-up";
            } else if (isDownEdge) {
              classes.push("edge-downstream");
              markerId = "warr-down";
            } else {
              classes.push("dimmed");
            }
          }

          pathEl.setAttribute("class", classes.join(" "));
          pathEl.setAttribute("marker-end", `url(#${markerId})`);
          els.dagEdges.appendChild(pathEl);
        }

        // Render tier headers + ticket cards
        els.dagNodes.textContent = "";
        sortedTiers.forEach((tierNum, colIdx) => {
          const x = W_PAD_X + colIdx * (W_NODE_W + W_COL_GAP);
          const hdr = el("div", "tier-header", `Tier ${tierNum}`);
          hdr.style.left = `${x}px`;
          els.dagNodes.appendChild(hdr);
        });

        for (const item of visibleItems) {
          const r = state.workRects.get(item.id);
          const card = el("div", `dag-node work-node wstatus-${item.tech_status}`);
          card.style.left = `${r.x}px`;
          card.style.top = `${r.y}px`;
          card.setAttribute("tabindex", "0");
          card.setAttribute("role", "button");
          card.setAttribute("data-work-id", item.id);
          card.setAttribute("aria-label", `${item.id}: ${item.title} (${item.tech_status})`);

          const proj = item.project_id ? projectById.get(item.project_id) : null;
          if (proj && proj.color && /^#[0-9a-fA-F]{3,8}$/.test(proj.color)) {
            card.style.borderLeftColor = proj.color;
          }

          if (item.id === state.selectedWorkId) card.classList.add("selected");

          if (state.highlightCriticalPath) {
            if (cpNodeSet.has(item.id)) {
              card.classList.add("node-blast");
            } else {
              card.classList.add("dimmed");
            }
          } else if (focusId && visibleIds.has(focusId) && focusId !== item.id) {
            if (up.has(item.id)) card.classList.add("node-upstream");
            else if (down.has(item.id)) card.classList.add("node-downstream");
            else card.classList.add("dimmed");
          }

          const head = el("div", "node-head");
          head.appendChild(el("span", "node-stage-tag", item.id));
          const rightMeta = el("div", "node-badges");
          if (item.estimate !== null && item.estimate !== undefined) {
            rightMeta.appendChild(el("span", "badge badge-neutral", `${item.estimate} pts`));
          }
          if (item.prs && item.prs.length > 0) {
            rightMeta.appendChild(el("span", "badge badge-unreviewed", `PR${item.prs.length > 1 ? ` ×${item.prs.length}` : ""}`));
          }
          if (item.on_critical_path) {
            rightMeta.appendChild(el("span", "badge badge-stale", "CP"));
          }
          head.appendChild(rightMeta);
          card.appendChild(head);

          card.appendChild(el("div", "work-title", item.title));

          const ms = item.milestone_id ? milestoneById.get(item.milestone_id) : null;
          const scopeTag = ms ? ms.name : proj ? proj.name : "";
          if (scopeTag) {
            card.appendChild(el("div", "node-file", scopeTag));
          }

          const badges = el("div", "node-badges");
          const wb = workBadgeForStatus(item.tech_status);
          badges.appendChild(el("span", `badge ${wb.cls}`, wb.text));
          card.appendChild(badges);

          card.addEventListener("mouseenter", () => {
            if (state.hoveredWorkId !== item.id) {
              state.hoveredWorkId = item.id;
              renderWorkDag();
            }
          });
          card.addEventListener("mouseleave", () => {
            if (state.hoveredWorkId !== null) {
              state.hoveredWorkId = null;
              renderWorkDag();
            }
          });
          card.addEventListener("click", () => selectWorkItem(item.id));
          card.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              selectWorkItem(item.id);
            }
          });

          els.dagNodes.appendChild(card);
        }
      }

      function selectWorkItem(itemId, { scrollIntoView = false } = {}) {
        const changed = state.selectedWorkId !== itemId;
        state.selectedWorkId = itemId;

        // If target item is currently filtered out, relax filters so jump navigation always succeeds
        const visible = getFilteredWorkItems();
        if (!visible.some((it) => it.id === itemId)) {
          state.workScope = "all";
          state.workFilter = "all";
          state.hideDone = false;
          els.scopeSelect.value = "all";
          syncWorkFilterButtons();
          renderWorkSummary();
        }

        renderWorkDag();
        renderWorkInspector({ preserveScroll: !changed });

        if (scrollIntoView) {
          const r = state.workRects.get(itemId);
          if (r) {
            els.canvasScroller.scrollTo({
              left: Math.max(0, r.x * state.zoom - 120),
              top: Math.max(0, r.y * state.zoom - 100),
              behavior: "smooth",
            });
          }
        }
      }

      function renderWorkInspector({ preserveScroll = true } = {}) {
        const wg = state.workEnvelope?.graph;
        const prevScroll = preserveScroll ? els.inspectorBody.scrollTop : 0;

        els.inspectorHeader.textContent = "";
        els.inspectorBody.textContent = "";

        if (!wg) {
          els.inspectorHeader.appendChild(el("h2", "inspector-title", "Work Ticket Inspector"));
          els.inspectorBody.appendChild(
            el("div", "empty-note", "Load a work-graph snapshot or configure Linear GraphQL to inspect tickets.")
          );
          return;
        }

        const itemById = new Map((wg.items || []).map((it) => [it.id, it]));
        const projectById = new Map((wg.projects || []).map((p) => [p.id, p]));
        const milestoneById = new Map((wg.milestones || []).map((m) => [m.id, m]));
        const item = state.selectedWorkId ? itemById.get(state.selectedWorkId) : null;

        if (!item) {
          els.inspectorHeader.appendChild(el("h2", "inspector-title", "Select a work item"));
          els.inspectorBody.appendChild(
            el("div", "empty-note", "Click any ticket node on the Work Tech-Tree canvas to inspect blockers, unlocks, PRs, description, and tailored prompt.")
          );
          return;
        }

        // Header row
        const titleRow = el("div", "inspector-title-row");
        const titleWrap = el("div");
        titleWrap.appendChild(el("div", "inspector-sub", `${item.id} · Tier ${item.tier}`));
        titleWrap.appendChild(el("h2", "inspector-title", item.title));
        titleRow.appendChild(titleWrap);

        const badgeWrap = el("div", "node-badges");
        const wb = workBadgeForStatus(item.tech_status);
        badgeWrap.appendChild(el("span", `badge ${wb.cls}`, wb.text));
        if (item.on_critical_path) {
          badgeWrap.appendChild(el("span", "badge badge-stale", "CRITICAL PATH"));
        }
        titleRow.appendChild(badgeWrap);
        els.inspectorHeader.appendChild(titleRow);

        // Deep link row (strictly https://)
        const actionsRow = el("div", "inspector-actions-row");
        const safeLinearUrl = sanitizeExternalHttpsUrl(item.url);
        if (safeLinearUrl) {
          const link = el("a", "btn", "Open in Linear ↗");
          link.href = safeLinearUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          actionsRow.appendChild(link);

        if (item.git_branch) {
          const copyBranchBtn = el("button", "btn", "Copy Branch");
          copyBranchBtn.type = "button";

          );

        if (actionsRow.childNodes.length > 0) {
          els.inspectorHeader.appendChild(actionsRow);

        // State-aware Copy Prompt bar
        const promptBox = el("div", "prompt-box");
        const pHead = el("div", "prompt-box-head");
        pHead.appendChild(el("span", "prompt-box-label", workPromptLabel(item)));
        const copyBtn = el("button", "btn btn-primary", "Copy Prompt");
        copyBtn.type = "button";
        copyBtn.addEventListener("click", () =>
          copyText(item.next_prompt || "", "Copied ticket prompt to clipboard")
        );
        pHead.appendChild(copyBtn);
        promptBox.appendChild(pHead);
        promptBox.appendChild(el("p", "prompt-text", item.next_prompt || ""));
        els.inspectorHeader.appendChild(promptBox);

        // Cycle warnings banner if present
        if (wg.summary?.cycle_warnings?.length > 0) {
          const warnBox = el("div", "alert-card alert-warn");
          warnBox.appendChild(el("h4", "", "Dependency Cycle Warnings"));
          const ul = el("ul");

          warnBox.appendChild(ul);

        // Metadata Grid
        const proj = item.project_id ? projectById.get(item.project_id) : null;
        const ms = item.milestone_id ? milestoneById.get(item.milestone_id) : null;
        const metaGrid = el("div", "meta-grid");
        [
          ["Project", proj ? proj.name : "—"],
          ["Milestone", ms ? ms.name : "—"],
          ["Tracker Status", `${item.status_name} (${item.status_type})`],
          ["Estimate", item.estimate !== null && item.estimate !== undefined ? `${item.estimate} pts` : "Unestimated"],
          ["Priority", PRIORITY_NAMES[item.priority] || "None"],
          ["Assignee", item.assignee || "Unassigned"],
        ].forEach(([k, v]) => {
          const c = el("div", "kv-card");
          c.appendChild(el("div", "kv-key", k));
          c.appendChild(el("div", "kv-value", v));
          metaGrid.appendChild(c);
        });
        els.inspectorBody.appendChild(metaGrid);

        if (item.git_branch) {

          branchCard.appendChild(el("div", "kv-key", "Git Branch"));
          branchCard.appendChild(el("div", "kv-value inspector-sub", item.git_branch));
          els.inspectorBody.appendChild(branchCard);
        }

        if (item.labels && item.labels.length > 0) {
          const lblCard = el("div", "kv-card");
          lblCard.appendChild(el("div", "kv-key", "Labels"));
          const wrap = el("div", "node-badges");
          item.labels.forEach((lbl) => wrap.appendChild(el("span", "badge badge-neutral", lbl)));
          lblCard.appendChild(wrap);
          els.inspectorBody.appendChild(lblCard);

        // Blockers (Upstream)
        const blockersCard = el("div", "kv-card");
        blockersCard.appendChild(el("div", "kv-key", `Blockers / Prerequisites (${item.blocked_by.length})`));
