<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Software Factory — Live Tech-Tree View</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --bg-grid: #e2e8f0;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --border: #cbd5e1;
      --border-subtle: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;

      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-text: #1d4ed8;

      --pass-bg: #dcfce7;
      --pass-border: #16a34a;
      --pass-text: #14532d;

      --fail-bg: #fee2e2;
      --fail-border: #dc2626;
      --fail-text: #7f1d1d;

      --stale-bg: #fef3c7;
      --stale-border: #d97706;
      --stale-text: #78350f;

      --unrev-bg: #dbeafe;
      --unrev-border: #2563eb;
      --unrev-text: #1e3a8a;

      --unlock-bg: #ccfbf1;
      --unlock-border: #0d9488;
      --unlock-text: #115e59;

      --lock-bg: #f1f5f9;
      --lock-border: #94a3b8;
      --lock-text: #475569;

      --invalid-bg: #fae8ff;
      --invalid-border: #c026d3;
      --invalid-text: #701a75;

      --edge-required: #94a3b8;
      --edge-optional: #cbd5e1;
      --edge-upstream: #0284c7;
      --edge-downstream: #7c3aed;
      --edge-blast: #ea580c;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-focus: 0 0 0 3px rgba(37, 99, 235, 0.25);

      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1120;
        --bg-grid: #1e293b;
        --surface: #111827;
        --surface-2: #1e293b;
        --surface-3: #334155;
        --border: #334155;
        --border-subtle: #1f2937;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-faint: #64748b;

        --accent: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.18);
        --accent-text: #93c5fd;

        --pass-bg: rgba(22, 163, 74, 0.2);
        --pass-border: #22c55e;
        --pass-text: #86efac;

        --fail-bg: rgba(220, 38, 38, 0.22);
        --fail-border: #ef4444;
        --fail-text: #fca5a5;

        --stale-bg: rgba(217, 119, 6, 0.22);
        --stale-border: #f59e0b;
        --stale-text: #fcd34d;

        --unrev-bg: rgba(37, 99, 235, 0.22);
        --unrev-border: #60a5fa;
        --unrev-text: #bfdbfe;

        --unlock-bg: rgba(13, 148, 136, 0.22);
        --unlock-border: #2dd4bf;
        --unlock-text: #99f6e4;

        --lock-bg: rgba(51, 65, 85, 0.45);
        --lock-border: #475569;
        --lock-text: #94a3b8;

        --invalid-bg: rgba(192, 38, 211, 0.22);
        --invalid-border: #e879f9;
        --invalid-text: #f5d0fe;

        --edge-required: #475569;
        --edge-optional: #334155;
        --edge-upstream: #38bdf8;
        --edge-downstream: #a78bfa;
        --edge-blast: #fb923c;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
        --shadow-focus: 0 0 0 3px rgba(96, 165, 250, 0.35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1120;
      --bg-grid: #1e293b;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #334155;
      --border: #334155;
      --border-subtle: #1f2937;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;

      --accent: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --accent-text: #93c5fd;

      --pass-bg: rgba(22, 163, 74, 0.2);
      --pass-border: #22c55e;
      --pass-text: #86efac;

      --fail-bg: rgba(220, 38, 38, 0.22);
      --fail-border: #ef4444;
      --fail-text: #fca5a5;

      --stale-bg: rgba(217, 119, 6, 0.22);
      --stale-border: #f59e0b;
      --stale-text: #fcd34d;

      --unrev-bg: rgba(37, 99, 235, 0.22);
      --unrev-border: #60a5fa;
      --unrev-text: #bfdbfe;

      --unlock-bg: rgba(13, 148, 136, 0.22);
      --unlock-border: #2dd4bf;
      --unlock-text: #99f6e4;

      --lock-bg: rgba(51, 65, 85, 0.45);
      --lock-border: #475569;
      --lock-text: #94a3b8;

      --invalid-bg: rgba(192, 38, 211, 0.22);
      --invalid-border: #e879f9;
      --invalid-text: #f5d0fe;

      --edge-required: #475569;
      --edge-optional: #334155;
      --edge-upstream: #38bdf8;
      --edge-downstream: #a78bfa;
      --edge-blast: #fb923c;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
      --shadow-focus: 0 0 0 3px rgba(96, 165, 250, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top summary bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      border: 1px solid var(--accent);
      flex-shrink: 0;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .project-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .project-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .summary-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text);
    }

    .metric-pill.has-stale {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    .metric-pill.has-fail {
      background: var(--fail-bg);
      border-color: var(--fail-border);
      color: var(--fail-text);
    }

    .metric-pill.has-invalid {
      background: var(--invalid-bg);
      border-color: var(--invalid-border);
      color: var(--invalid-text);
    }

    .metric-pill.has-unlocked {
      background: var(--unlock-bg);
      border-color: var(--unlock-border);
      color: var(--unlock-text);
    }

    .progress-bar-track {
      width: 56px;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--pass-border);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-2);
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .btn.active-blast {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    .btn.active-toggle {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      background: var(--accent);
    }

    .sse-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .sse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
    }

    .sse-pill[data-state="connected"] {
      color: var(--pass-text);
      background: var(--pass-bg);
      border-color: var(--pass-border);
    }

    .sse-pill[data-state="connected"] .sse-dot {
      background: var(--pass-border);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
    }

    .sse-pill[data-state="reconnecting"] {
      color: var(--stale-text);
      background: var(--stale-bg);
      border-color: var(--stale-border);
    }

    .sse-pill[data-state="reconnecting"] .sse-dot {
      background: var(--stale-border);
    }

    /* Main workspace layout */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Left DAG Canvas */
    .canvas-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-grid) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .canvas-scroller {
      flex: 1;
      overflow: auto;
      position: relative;
      padding: 24px;
    }

    .dag-stage {
      position: relative;
      transform-origin: 0 0;
      transition: transform 0.15s ease;
    }

    .dag-edges-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .dag-edge {
      fill: none;
      stroke: var(--edge-required);
      stroke-width: 2;
      opacity: 0.72;
      transition: opacity 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease;
    }

    .dag-edge.kind-recommended,
    .dag-edge.kind-optional {
      stroke: var(--edge-optional);
      stroke-dasharray: 6 4;
    }

    .dag-edge.edge-skip {
      opacity: 0.32;
    }

    .dag-edge.dimmed {
      opacity: 0.1 !important;
    }

    .dag-edge.edge-upstream {
      stroke: var(--edge-upstream) !important;
      stroke-width: 2.75 !important;
      opacity: 0.98 !important;
    }

    .dag-edge.edge-downstream {
      stroke: var(--edge-downstream) !important;
      stroke-width: 2.75 !important;
      opacity: 0.98 !important;
    }

    .dag-edge.edge-blast {
      stroke: var(--edge-blast) !important;
      stroke-width: 3 !important;
      opacity: 1 !important;
    }

    /* Node Cards */
    .dag-node {
      position: absolute;
      width: 196px;
      min-height: 112px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }

    .dag-node:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .dag-node:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .dag-node.optional-node {
      border-style: dashed;
    }

    .dag-node.status-reviewed_pass { border-color: var(--pass-border); }
    .dag-node.status-reviewed_fail { border-color: var(--fail-border); }
    .dag-node.status-unreviewed { border-color: var(--unrev-border); }
    .dag-node.status-unlocked { border-color: var(--unlock-border); }
    .dag-node.status-locked { border-color: var(--lock-border); opacity: 0.78; }
    .dag-node.status-invalid { border-color: var(--invalid-border); }
    .dag-node.is-stale { border-color: var(--stale-border); }

    .dag-node.selected {
      box-shadow: 0 0 0 3px var(--accent), var(--shadow-md);
      z-index: 5;
      opacity: 1;
    }

    .dag-node.dimmed {
      opacity: 0.28;
    }

    .dag-node.node-upstream {
      box-shadow: 0 0 0 2px var(--edge-upstream), var(--shadow-sm);
      opacity: 1;
    }

    .dag-node.node-downstream {
      box-shadow: 0 0 0 2px var(--edge-downstream), var(--shadow-sm);
      opacity: 1;
    }

    .dag-node.node-blast {
      box-shadow: 0 0 0 3px var(--edge-blast), var(--shadow-md);
      opacity: 1;
    }

    .node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .node-stage-tag {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .node-skill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }

    .node-file {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .badge-pass { background: var(--pass-bg); color: var(--pass-text); border-color: var(--pass-border); }
    .badge-fail { background: var(--fail-bg); color: var(--fail-text); border-color: var(--fail-border); }
    .badge-stale { background: var(--stale-bg); color: var(--stale-text); border-color: var(--stale-border); }
    .badge-unreviewed { background: var(--unrev-bg); color: var(--unrev-text); border-color: var(--unrev-border); }
    .badge-unlocked { background: var(--unlock-bg); color: var(--unlock-text); border-color: var(--unlock-border); }
    .badge-locked { background: var(--lock-bg); color: var(--lock-text); border-color: var(--lock-border); }
    .badge-invalid { background: var(--invalid-bg); color: var(--invalid-text); border-color: var(--invalid-border); }
    .badge-neutral { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }

    /* Canvas footer controls & legend */
    .canvas-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-items {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-line {
      width: 18px;
      height: 0;
      border-top: 2px solid var(--edge-required);
    }

    .legend-line.dashed {
      border-top-style: dashed;
      border-top-color: var(--text-faint);
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Side Inspector Drawer */
    .inspector {
      width: 430px;
      max-width: 46vw;
      min-width: 320px;
      background: var(--surface);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 10;
    }

    .inspector-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inspector-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .inspector-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .inspector-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Copy Prompt Action Card */
    .prompt-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prompt-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .prompt-box-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .prompt-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      font-family: var(--font-mono);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    /* Inspector Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 12px;
      gap: 4px;
      background: var(--surface);
    }

    .tab-btn {
      padding: 9px 12px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent-text);
      border-bottom-color: var(--accent);
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .alert-card {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.45;
    }

    .alert-card h4 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .alert-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .alert-card.alert-error {
      background: var(--fail-bg);
      border-color: var(--fail-border);
      color: var(--fail-text);
    }

    .alert-card.alert-stale {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    .alert-card.alert-warn {
      background: var(--stale-bg);
      border-color: var(--stale-border);
      color: var(--stale-text);
    }

    /* Structured State Cards */
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kv-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
    }

    .kv-key {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kv-value {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }

    .kv-value ul {
      margin: 0;
      padding-left: 18px;
    }

    .kv-pre {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11.5px;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 8px;
      overflow-x: auto;
    }

    details.raw-json-details {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 8px 10px;
    }

    details.raw-json-details summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Mockery Extras Panel */
    .mockery-card {
      background: var(--surface-2);
      border: 1px dashed var(--accent);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mockery-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mockery-stat {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
    }

    .mockery-stat-val {
      font-size: 15px;
      font-weight: 700;
    }

    .mockery-stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .cmd-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cmd-code {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      padding: 5px 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .preview-input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
    }

    /* Safe Narrative Markdown Styling */
    .md-view {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    .md-view h1, .md-view h2, .md-view h3, .md-view h4 {
      margin: 14px 0 6px;
      line-height: 1.3;
    }
    .md-view h1 { font-size: 18px; }
    .md-view h2 { font-size: 15.5px; }
    .md-view h3 { font-size: 14px; }
    .md-view h4 { font-size: 13px; }
    .md-view p { margin: 0 0 10px; }
    .md-view ul, .md-view ol { margin: 0 0 10px; padding-left: 20px; }
    .md-view li { margin-bottom: 4px; }
    .md-view blockquote {
      margin: 0 0 10px;
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .md-view code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--surface-2);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .md-view pre {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 0 0 10px;
    }
    .md-view pre code {
      background: transparent;
      padding: 0;
    }
    .md-view table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 12px;
      font-size: 12px;
    }
    .md-view th, .md-view td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      text-align: left;
    }
    .md-view th {
      background: var(--surface-2);
      font-weight: 700;
    }
    .md-view a {
      color: var(--accent-text);
      text-decoration: underline;
    }
    .md-view hr {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 12px 0;
    }

    /* Reviews List */
    .review-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .review-meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .empty-note {
      color: var(--text-muted);
      font-size: 12.5px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--text);
      color: var(--surface);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 960px) {
      .workspace { flex-direction: column; }
      .inspector {
        width: 100%;
        max-width: 100%;
        height: 46vh;
        border-left: none;
        border-top: 1px solid var(--border-subtle);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark" aria-hidden="true">SF</div>
        <div class="project-meta">
          <div id="project-name" class="project-title">Loading project…</div>
          <div id="workspace-root" class="project-sub">docs/factory</div>
        </div>
      </div>

      <div class="summary-metrics" id="summary-metrics">
        <span class="metric-pill" id="metric-core">
          <span id="metric-core-text">0/8 Core</span>
          <span class="progress-bar-track"><span id="metric-core-fill" class="progress-bar-fill" style="width:0%"></span></span>
        </span>
        <span class="metric-pill" id="metric-unlocked">Unlocked: 0</span>
        <span class="metric-pill" id="metric-stale">Stale: 0</span>
        <span class="metric-pill" id="metric-fail">Failing: 0</span>
        <span class="metric-pill" id="metric-invalid" style="display:none">Invalid: 0</span>
      </div>

      <div class="toolbar-controls">
        <button type="button" id="btn-toggle-mockery" class="btn active-toggle" aria-pressed="true">Show Mockery (6b)</button>
        <button type="button" id="btn-toggle-blast" class="btn" aria-pressed="false">Highlight Stale Blast Radius</button>
        <button type="button" id="btn-theme" class="btn" title="Toggle light/dark theme">Theme</button>
        <span id="sse-pill" class="sse-pill" data-state="reconnecting" role="status" aria-live="polite">
          <span class="sse-dot"></span>
          <span id="sse-label">Connecting…</span>
        </span>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-pane" aria-label="Pipeline Tech-Tree DAG">
        <div id="canvas-scroller" class="canvas-scroller">
          <div id="dag-stage" class="dag-stage">
            <svg id="dag-edges" class="dag-edges-svg" aria-hidden="true"></svg>
            <div id="dag-nodes"></div>
          </div>
        </div>
        <div class="canvas-footer">
          <div class="legend-items">
            <span class="legend-item"><span class="legend-line"></span> Required edge</span>
            <span class="legend-item"><span class="legend-line dashed"></span> Recommended / Optional</span>
            <span class="legend-item"><span class="badge badge-pass">PASS</span></span>
            <span class="legend-item"><span class="badge badge-fail">FAIL</span></span>
            <span class="legend-item"><span class="badge badge-stale">STALE</span></span>
            <span class="legend-item"><span class="badge badge-unreviewed">UNREVIEWED</span></span>
            <span class="legend-item"><span class="badge badge-unlocked">UNLOCKED</span></span>
            <span class="legend-item"><span class="badge badge-locked">LOCKED</span></span>
          </div>
          <div class="zoom-controls">
            <button type="button" id="btn-zoom-out" class="btn" aria-label="Zoom out">-</button>
            <button type="button" id="btn-zoom-fit" class="btn">Fit</button>
            <button type="button" id="btn-zoom-reset" class="btn">100%</button>
            <button type="button" id="btn-zoom-in" class="btn" aria-label="Zoom in">+</button>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-label="Stage Inspector">
        <div class="inspector-header" id="inspector-header"></div>
        <div class="tab-bar" role="tablist">
          <button type="button" class="tab-btn active" role="tab" data-tab="overview" aria-selected="true">Overview / &lt;system_state&gt;</button>
          <button type="button" class="tab-btn" role="tab" data-tab="narrative" aria-selected="false">Narrative</button>
          <button type="button" class="tab-btn" role="tab" data-tab="reviews" aria-selected="false" id="tab-btn-reviews">Reviews</button>
        </div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const NODE_W = 196;
      const NODE_H = 114;
      const COL_GAP = 54;
      const PAD_X = 36;
      const PAD_Y = 74;
      const ROW_GAP = 72;

      const LAYOUT = {
        vision: { col: 0, row: 0 },
        "market-research": { col: 1, row: 0 },
        brd: { col: 2, row: 0 },
        prd: { col: 3, row: 0 },
        ux: { col: 4, row: 0 },
        ui: { col: 5, row: 0 },
        mockery: { col: 5, row: 1 },
        architecture: { col: 6, row: 0 },
        specs: { col: 7, row: 0 },
      };

      const state = {
        graph: null,
        selectedPhase: null,
        hoveredPhase: null,
        activeTab: "overview",
        showMockery: true,
        highlightBlast: false,
        zoom: 1,
        artifactCache: new Map(), // phase -> { mtimeMs, data }
        reviewCache: new Map(),   // filename -> { mtimeMs, data }
        expandedReviews: new Set(),
        mockeryPreviewUrl:
          safeStorageGet("sf-tree-mockery-url") || "http://127.0.0.1:4174",
      };

      const els = {
        projectName: document.getElementById("project-name"),
        workspaceRoot: document.getElementById("workspace-root"),
        metricCoreText: document.getElementById("metric-core-text"),
        metricCoreFill: document.getElementById("metric-core-fill"),
        metricUnlocked: document.getElementById("metric-unlocked"),
        metricStale: document.getElementById("metric-stale"),
        metricFail: document.getElementById("metric-fail"),
        metricInvalid: document.getElementById("metric-invalid"),
        btnMockery: document.getElementById("btn-toggle-mockery"),
        btnBlast: document.getElementById("btn-toggle-blast"),
        btnTheme: document.getElementById("btn-theme"),
        ssePill: document.getElementById("sse-pill"),
        sseLabel: document.getElementById("sse-label"),
        canvasScroller: document.getElementById("canvas-scroller"),
        dagStage: document.getElementById("dag-stage"),
        dagEdges: document.getElementById("dag-edges"),
        dagNodes: document.getElementById("dag-nodes"),
        inspectorHeader: document.getElementById("inspector-header"),
        inspectorBody: document.getElementById("inspector-body"),
        tabBtnReviews: document.getElementById("tab-btn-reviews"),
        toast: document.getElementById("toast"),
      };

      function safeStorageGet(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      }
      function safeStorageSet(key, val) {
        try { localStorage.setItem(key, val); } catch {}
      }

      // Theme initialization
      function initTheme() {
        const saved = safeStorageGet("sf-tree-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
        updateThemeButton();
      }

      function isDarkEffective() {
        const attr = document.documentElement.getAttribute("data-theme");
        if (attr === "dark") return true;
        if (attr === "light") return false;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function updateThemeButton() {
        els.btnTheme.textContent = isDarkEffective() ? "Light Mode" : "Dark Mode";
      }

      els.btnTheme.addEventListener("click", () => {
        const next = isDarkEffective() ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        safeStorageSet("sf-tree-theme", next);
        updateThemeButton();
      });

      // Toast helper
      let toastTimer = null;
      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add("visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toast.classList.remove("visible");
        }, 2200);
      }

      async function copyText(text, label) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          showToast(label || "Copied to clipboard");
        } catch {
          showToast("Copy failed — select text manually");
        }
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function badgeForStatus(status) {
        switch (status) {
          case "reviewed_pass": return { text: "PASS", cls: "badge-pass" };
          case "reviewed_fail": return { text: "FAIL", cls: "badge-fail" };
          case "unreviewed": return { text: "UNREVIEWED", cls: "badge-unreviewed" };
          case "unlocked": return { text: "UNLOCKED", cls: "badge-unlocked" };
          case "invalid": return { text: "INVALID", cls: "badge-invalid" };
          default: return { text: "LOCKED", cls: "badge-locked" };
        }
      }

      function promptActionLabel(node) {
        if (node.status === "invalid") return "Repair <system_state>";
        if (node.status === "reviewed_fail") return "Fix Blocking Review Issues";
        if (node.is_stale) return "Reconcile Stale Artifact";
        if (node.status === "unlocked") return "Run Unlocked Stage";
        if (node.status === "unreviewed") return node.phase === "vision" ? "Next Stage Prompt" : "Run sf-review";
        if (node.reviews && node.reviews[0] && node.reviews[0].is_stale) return "Re-run Stale sf-review";
        return "Next Step Prompt";
      }

      function getVisibleNodes() {
        if (!state.graph) return [];
        return state.graph.nodes.filter((n) => state.showMockery || !n.optional);
      }

      function getVisibleEdges() {
        if (!state.graph) return [];
        const visiblePhases = new Set(getVisibleNodes().map((n) => n.phase));
        return state.graph.edges.filter(
          (e) => visiblePhases.has(e.from) && visiblePhases.has(e.to)
        );
      }

      function nodeRect(phase) {
        const pos = LAYOUT[phase] || { col: 0, row: 0 };
        const x = PAD_X + pos.col * (NODE_W + COL_GAP);
        const y = PAD_Y + pos.row * (NODE_H + ROW_GAP);
        return { x, y, w: NODE_W, h: NODE_H, col: pos.col, row: pos.row };
      }

      function computeAncestorsAndDescendants(focusPhase, edges) {
        const up = new Set();
        const down = new Set();
        if (!focusPhase) return { up, down };

        const qUp = [focusPhase];
        while (qUp.length) {
          const cur = qUp.shift();
          for (const e of edges) {
            if (e.to === cur && !up.has(e.from) && e.from !== focusPhase) {
              up.add(e.from);
              qUp.push(e.from);
            }
          }
        }

        const qDown = [focusPhase];
        while (qDown.length) {
          const cur = qDown.shift();
          for (const e of edges) {
            if (e.from === cur && !down.has(e.to) && e.to !== focusPhase) {
              down.add(e.to);
              qDown.push(e.to);
            }
          }
        }
        return { up, down };
      }

      function computeBlastSet(nodes, edges) {
        const blastNodes = new Set();
        const byPhase = new Map(nodes.map((n) => [n.phase, n]));
        for (const n of nodes) {
          if (n.is_stale || n.status === "invalid") {
            blastNodes.add(n.phase);
          }
        }
        // Also highlight immediate root-cause upstreams feeding a stale node.
        const blastEdges = new Set();
        for (let i = 0; i < edges.length; i += 1) {
          const e = edges[i];
          const toNode = byPhase.get(e.to);
          const fromNode = byPhase.get(e.from);
          if (toNode && toNode.is_stale && fromNode && fromNode.exists) {
            if (
              fromNode.is_stale ||
              !fromNode.state_valid ||
              (toNode.stale_reasons || []).some((r) => r.includes(fromNode.file))
            ) {
              blastEdges.add(i);
              blastNodes.add(fromNode.phase);
            }
          }
        }
        return { blastNodes, blastEdges };
      }

      function renderSummary() {
        const g = state.graph;
        if (!g) return;
        const s = g.summary;
        els.projectName.textContent = g.project_name || "Software Factory";
        els.workspaceRoot.textContent = g.workspace_root || "docs/factory";
        els.workspaceRoot.title = g.workspace_root || "";

        const pct = s.core_total > 0 ? Math.round((s.core_completed / s.core_total) * 100) : 0;
        els.metricCoreText.textContent = `${s.core_completed}/${s.core_total} Core`;
        els.metricCoreFill.style.width = `${pct}%`;

        els.metricUnlocked.textContent = `Unlocked: ${s.unlocked_phases.length}`;
        els.metricUnlocked.classList.toggle("has-unlocked", s.unlocked_phases.length > 0);

        els.metricStale.textContent = `Stale: ${s.stale_phases.length}`;
        els.metricStale.classList.toggle("has-stale", s.stale_phases.length > 0);

        els.metricFail.textContent = `Failing: ${s.failing_review_phases.length}`;
        els.metricFail.classList.toggle("has-fail", s.failing_review_phases.length > 0);

        if (s.invalid_phases.length > 0) {
          els.metricInvalid.style.display = "inline-flex";
          els.metricInvalid.textContent = `Invalid: ${s.invalid_phases.length}`;
          els.metricInvalid.classList.add("has-invalid");
        } else {
          els.metricInvalid.style.display = "none";
        }
      }

      function renderDag() {
        const g = state.graph;
        if (!g) return;
        const nodes = getVisibleNodes();
        const edges = getVisibleEdges();

        const maxCol = Math.max(...nodes.map((n) => (LAYOUT[n.phase]?.col ?? 0)));
        const maxRow = Math.max(...nodes.map((n) => (LAYOUT[n.phase]?.row ?? 0)));
        const stageW = PAD_X * 2 + (maxCol + 1) * NODE_W + maxCol * COL_GAP;
        const stageH = PAD_Y + (maxRow + 1) * NODE_H + maxRow * ROW_GAP + 68;

        els.dagStage.style.width = `${stageW}px`;
        els.dagStage.style.height = `${stageH}px`;
        els.dagStage.style.transform = `scale(${state.zoom})`;

        els.dagEdges.setAttribute("width", String(stageW));
        els.dagEdges.setAttribute("height", String(stageH));
        els.dagEdges.setAttribute("viewBox", `0 0 ${stageW} ${stageH}`);
        els.dagEdges.textContent = "";

        const focusPhase = state.hoveredPhase || state.selectedPhase;
        const { up, down } = computeAncestorsAndDescendants(focusPhase, edges);
        const { blastNodes, blastEdges } = state.highlightBlast
          ? computeBlastSet(nodes, edges)
          : { blastNodes: new Set(), blastEdges: new Set() };

        // Arrowhead markers
        const svgNS = "http://www.w3.org/2000/svg";
        const defs = document.createElementNS(svgNS, "defs");
        const markers = [
          { id: "arr-default", color: "var(--edge-required)" },
          { id: "arr-up", color: "var(--edge-upstream)" },
          { id: "arr-down", color: "var(--edge-downstream)" },
          { id: "arr-blast", color: "var(--edge-blast)" },
        ];
        for (const m of markers) {
          const marker = document.createElementNS(svgNS, "marker");
          marker.setAttribute("id", m.id);
          marker.setAttribute("markerWidth", "8");
          marker.setAttribute("markerHeight", "8");
          marker.setAttribute("refX", "7");
          marker.setAttribute("refY", "4");
          marker.setAttribute("orient", "auto");
          const poly = document.createElementNS(svgNS, "polygon");
          poly.setAttribute("points", "0 1, 8 4, 0 7");
          poly.setAttribute("fill", m.color);
          marker.appendChild(poly);
          defs.appendChild(marker);
        }
        els.dagEdges.appendChild(defs);

        // Render edges
        edges.forEach((edge, idx) => {
          const a = nodeRect(edge.from);
          const b = nodeRect(edge.to);
          const colSpan = b.col - a.col;
          let d;
          const isSkip = colSpan > 1;

          if (colSpan === 1 && a.row === b.row) {
            const x1 = a.x + a.w;
            const y1 = a.y + a.h / 2;
            const x2 = b.x - 2;
            const y2 = b.y + b.h / 2;
            const cx = (x1 + x2) / 2;
            d = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
          } else if (edge.to === "mockery" && edge.from === "ui") {
            const x1 = a.x + a.w / 2;
            const y1 = a.y + a.h;
            const x2 = b.x + b.w / 2;
            const y2 = b.y - 2;
            d = `M ${x1} ${y1} L ${x2} ${y2}`;
          } else if (edge.to === "mockery" || edge.from === "mockery") {
            const x1 = a.x + a.w;
            const y1 = a.y + a.h / 2 + (edge.to === "mockery" ? 18 : 0);
            const x2 = b.x - 2;
            const y2 = b.y + b.h / 2 + (edge.from === "mockery" ? 20 : 0);
            const dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
            d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
          } else {
            // Skip edge arched cleanly above row 0
            const lane = Math.min(5, colSpan);
            const arcLift = 20 + lane * 11;
            const x1 = a.x + a.w * 0.72;
            const y1 = a.y;
            const x2 = b.x + b.w * 0.28;
            const y2 = b.y - 2;
            const topY = Math.max(8, Math.min(y1, y2) - arcLift);
            d = `M ${x1} ${y1} C ${x1} ${topY}, ${x2} ${topY}, ${x2} ${y2}`;
          }

          const pathEl = document.createElementNS(svgNS, "path");
          pathEl.setAttribute("d", d);
          const classes = ["dag-edge", `kind-${edge.kind}`];
          if (isSkip) classes.push("edge-skip");

          let markerId = "arr-default";
          if (state.highlightBlast) {
            if (blastEdges.has(idx)) {
              classes.push("edge-blast");
              markerId = "arr-blast";
            } else {
              classes.push("dimmed");
            }
          } else if (focusPhase) {
            const isUpEdge =
              (edge.to === focusPhase || up.has(edge.to)) &&
              (up.has(edge.from) || edge.from === focusPhase) &&
              edge.from !== focusPhase;
            const isDownEdge =
              (edge.from === focusPhase || down.has(edge.from)) &&
              (down.has(edge.to) || edge.to === focusPhase) &&
              edge.to !== focusPhase;
            if (isUpEdge) {
              classes.push("edge-upstream");
              markerId = "arr-up";
            } else if (isDownEdge) {
              classes.push("edge-downstream");
              markerId = "arr-down";
            } else {
              classes.push("dimmed");
            }
          }

          pathEl.setAttribute("class", classes.join(" "));
          pathEl.setAttribute("marker-end", `url(#${markerId})`);
          els.dagEdges.appendChild(pathEl);
        });

        // Render node cards
        els.dagNodes.textContent = "";
        for (const node of nodes) {
          const r = nodeRect(node.phase);
          const card = el("div", "dag-node");
          card.style.left = `${r.x}px`;
          card.style.top = `${r.y}px`;
          card.setAttribute("tabindex", "0");
          card.setAttribute("role", "button");
          card.setAttribute("data-phase", node.phase);
          card.setAttribute("aria-label", `Stage ${node.stage} ${node.label} (${node.status})`);

          card.classList.add(`status-${node.status}`);
          if (node.optional) card.classList.add("optional-node");
          if (node.is_stale) card.classList.add("is-stale");
          if (node.phase === state.selectedPhase) card.classList.add("selected");

          if (state.highlightBlast) {
            if (blastNodes.has(node.phase)) {
              card.classList.add("node-blast");
            } else {
              card.classList.add("dimmed");
            }
          } else if (focusPhase && focusPhase !== node.phase) {
            if (up.has(node.phase)) {
              card.classList.add("node-upstream");
            } else if (down.has(node.phase)) {
              card.classList.add("node-downstream");
            } else {
              card.classList.add("dimmed");
            }
          }

          const head = el("div", "node-head");
          head.appendChild(el("span", "node-stage-tag", `Stage ${node.stage}`));
          head.appendChild(el("span", "node-skill", node.skill));
          card.appendChild(head);

          card.appendChild(el("div", "node-label", node.label));
          card.appendChild(el("div", "node-file", node.file.replace("docs/factory/", "")));

          const badges = el("div", "node-badges");
          const stBadge = badgeForStatus(node.status);
          badges.appendChild(el("span", `badge ${stBadge.cls}`, stBadge.text));
          if (node.is_stale) {
            badges.appendChild(el("span", "badge badge-stale", "STALE"));
          }
          if (node.reviews && node.reviews[0] && node.reviews[0].is_stale && !node.is_stale) {
            badges.appendChild(el("span", "badge badge-stale", "REV STALE"));
          }
          if (node.phase === "mockery" && g.mockery && g.mockery.fidelity) {
            badges.appendChild(el("span", "badge badge-neutral", g.mockery.fidelity));
          }
          if (node.warnings && node.warnings.length > 0) {
            badges.appendChild(el("span", "badge badge-stale", `${node.warnings.length} warn`));
          }
          card.appendChild(badges);

          card.addEventListener("mouseenter", () => {
            if (state.hoveredPhase !== node.phase) {
              state.hoveredPhase = node.phase;
              renderDag();
            }
          });
          card.addEventListener("mouseleave", () => {
            if (state.hoveredPhase !== null) {
              state.hoveredPhase = null;
              renderDag();
            }
          });
          card.addEventListener("click", () => selectNode(node.phase));
          card.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              selectNode(node.phase);
            }
          });

          els.dagNodes.appendChild(card);
        }
      }

      function selectNode(phase) {
        const changed = state.selectedPhase !== phase;
        state.selectedPhase = phase;
        renderDag();
        renderInspector({ preserveScroll: !changed });
      }

      function getSelectedNode() {
        if (!state.graph || !state.selectedPhase) return null;
        return state.graph.nodes.find((n) => n.phase === state.selectedPhase) || null;
      }

      function sanitizePreviewUrl(urlStr) {
        try {
          const u = new URL(urlStr);
          if (
            (u.protocol === "http:" || u.protocol === "https:") &&
            (u.hostname === "127.0.0.1" || u.hostname === "localhost")
          ) {
            return u.href;
          }
        } catch {}
        return null;
      }

      function renderInspector({ preserveScroll = true } = {}) {
        const node = getSelectedNode();
        const prevScroll = preserveScroll ? els.inspectorBody.scrollTop : 0;

        els.inspectorHeader.textContent = "";

        if (!node) {
          els.inspectorHeader.appendChild(el("h2", "inspector-title", "Select a stage"));
          els.inspectorBody.appendChild(
            el("div", "empty-note", "Click any node in the tech-tree DAG to inspect its <system_state>, narrative, reviews, and next prompt.")
          );
          return;
        }

        els.tabBtnReviews.textContent = `Reviews (${node.reviews.length})`;

        // Header title & badges
        const titleRow = el("div", "inspector-title-row");
        const titleWrap = el("div");
        titleWrap.appendChild(
          el("h2", "inspector-title", `${node.stage}. ${node.label}`)
        );
        titleWrap.appendChild(
          el("div", "inspector-sub", `${node.skill} · ${node.file}`)
        );
        titleRow.appendChild(titleWrap);

        const badgeWrap = el("div", "node-badges");
        const stBadge = badgeForStatus(node.status);
        badgeWrap.appendChild(el("span", `badge ${stBadge.cls}`, stBadge.text));
        if (node.is_stale) {
          badgeWrap.appendChild(el("span", "badge badge-stale", "STALE"));

        titleRow.appendChild(badgeWrap);
        els.inspectorHeader.appendChild(titleRow);

        // 1-Click Copy Prompt Bar
        const promptBox = el("div", "prompt-box");
        const pHead = el("div", "prompt-box-head");
        pHead.appendChild(el("span", "prompt-box-label", promptActionLabel(node)));
        const copyBtn = el("button", "btn btn-primary", "Copy Prompt");
        copyBtn.type = "button";
        copyBtn.addEventListener("click", () =>
          copyText(node.next_prompt || "", "Copied prompt to clipboard")
        );
        pHead.appendChild(copyBtn);
        promptBox.appendChild(pHead);
        promptBox.appendChild(el("p", "prompt-text", node.next_prompt || ""));
        els.inspectorHeader.appendChild(promptBox);

        // Active Tab Content

        } else if (state.activeTab === "narrative") {

        // Copy viewer & check commands

        if (!node.exists) {
          els.inspectorBody.appendChild(
            el(
              "div",

        if (!node.system_state) {

        // Metadata line

          : "n/a";

          el("div", "kv-value", `Resolved timestamp: ${ts} (source: ${node.time_source || "n/a"})`)

          } else if (typeof val === "object" && val !== null) {

          } else {

          }

          card.appendChild(valWrap);
          kvList.appendChild(card);
        }
        els.inspectorBody.appendChild(kvList);

        // Collapsible Raw JSON

        details.appendChild(el("summary", "", "Raw <system_state> JSON"));

        const copyJsonBtn = el("button", "btn", "Copy JSON");
        copyJsonBtn.type = "button";
        copyJsonBtn.style.margin = "8px 0";
        copyJsonBtn.addEventListener("click", () => copyText(rawStr, "Copied <system_state> JSON"));
        details.appendChild(copyJsonBtn);
        details.appendChild(el("pre", "kv-pre", rawStr));
        els.inspectorBody.appendChild(details);
      }

      /**
       * XSS-safe Markdown renderer built strictly with DOM APIs (textContent only).
       * Never uses innerHTML on untrusted markdown; blocks unsafe URL schemes.
       */
      function renderSafeInline(container, text) {
        const tokenRe = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[([^\]]+)\]\(([^)]+)\))/g;
        let lastIdx = 0;
        let match;

        while ((match = tokenRe.exec(text)) !== null) {
          if (match.index > lastIdx) {
            container.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
          }
          const tok = match[0];
          if (tok.startsWith("`")) {
            container.appendChild(el("code", "", tok.slice(1, -1)));
          } else if (tok.startsWith("**")) {
            container.appendChild(el("strong", "", tok.slice(2, -2)));
          } else if (tok.startsWith("*")) {
            container.appendChild(el("em", "", tok.slice(1, -1)));
          } else if (tok.startsWith("[")) {
            const linkText = match[2];
            const rawHref = match[3].trim();
            let safeHref = null;
            try {
              const parsed = new URL(rawHref);
              if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                safeHref = parsed.href;
              }
            } catch {}
            if (safeHref) {
              const a = el("a", "", linkText);
              a.href = safeHref;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              container.appendChild(a);
            } else {
              container.appendChild(document.createTextNode(linkText));
            }
          }
          lastIdx = tokenRe.lastIndex;
        }

        if (lastIdx < text.length) {
          container.appendChild(document.createTextNode(text.slice(lastIdx)));
        }
      }

      function renderSafeMarkdown(markdown) {
        const root = el("div", "md-view");
        const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];

          // Blank line
          if (!line.trim()) {
            i += 1;
            continue;
          }

          // Fenced code block
          if (line.trim().startsWith("```")) {
            const codeLines = [];
            i += 1;
            while (i < lines.length && !lines[i].trim().startsWith("```")) {
              codeLines.push(lines[i]);
              i += 1;
            }
            if (i < lines.length) i += 1;
            const pre = el("pre");
            pre.appendChild(el("code", "", codeLines.join("\n")));
            root.appendChild(pre);
            continue;
          }

          // Horizontal rule
          if (/^(\s*[-*_]\s*){3,}$/.test(line)) {
            root.appendChild(el("hr"));
            i += 1;
            continue;
          }

          // Heading
          const hMatch = line.match(/^(#{1,4})\s+(.*)$/);
          if (hMatch) {
            const hTag = `h${hMatch[1].length}`;
            const hEl = el(hTag);
            renderSafeInline(hEl, hMatch[2].trim());
            root.appendChild(hEl);
            i += 1;
            continue;
          }

          // Blockquote
          if (line.trim().startsWith(">")) {
            const bq = el("blockquote");
            const bqLines = [];
            while (i < lines.length && lines[i].trim().startsWith(">")) {
              bqLines.push(lines[i].trim().replace(/^>\s?/, ""));
              i += 1;
            }
            const p = el("p");
            renderSafeInline(p, bqLines.join(" "));
            bq.appendChild(p);
            root.appendChild(bq);
            continue;
          }

          // Markdown table
          if (
            line.includes("|") &&
            i + 1 < lines.length &&
            /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])
          ) {
            const parseRow = (r) =>
              r
                .trim()
                .replace(/^\|/, "")
                .replace(/\|$/, "")
                .split("|")
                .map((c) => c.trim());
            const headers = parseRow(line);
            i += 2;
            const table = el("table");
            const thead = el("thead");
            const hTr = el("tr");
            headers.forEach((h) => {
              const th = el("th");
              renderSafeInline(th, h);
              hTr.appendChild(th);
            });
            thead.appendChild(hTr);
            table.appendChild(thead);

            const tbody = el("tbody");
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              const cells = parseRow(lines[i]);
              const tr = el("tr");
              cells.forEach((c) => {
                const td = el("td");
                renderSafeInline(td, c);
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
              i += 1;
            }
            table.appendChild(tbody);
            root.appendChild(table);
            continue;
          }

          // Unordered list
          if (/^\s*[-*+]\s+/.test(line)) {
            const ul = el("ul");
            while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
              const li = el("li");
              renderSafeInline(li, lines[i].replace(/^\s*[-*+]\s+/, ""));
              ul.appendChild(li);
              i += 1;
            }
            root.appendChild(ul);
            continue;
          }

          // Ordered list
          if (/^\s*\d+\.\s+/.test(line)) {
            const ol = el("ol");
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              const li = el("li");
              renderSafeInline(li, lines[i].replace(/^\s*\d+\.\s+/, ""));
              ol.appendChild(li);
              i += 1;
            }
            root.appendChild(ol);
            continue;
          }

          // Paragraph
          const pLines = [];
          while (
            i < lines.length &&
            lines[i].trim() &&
            !lines[i].trim().startsWith("```") &&
            !/^(#{1,4})\s+/.test(lines[i]) &&
            !lines[i].trim().startsWith(">") &&
            !/^\s*[-*+]\s+/.test(lines[i]) &&
            !/^\s*\d+\.\s+/.test(lines[i])
          ) {
            pLines.push(lines[i].trim());
            i += 1;
          }
          const p = el("p");
          renderSafeInline(p, pLines.join(" "));
          root.appendChild(p);
        }

        return root;
      }

      async function renderNarrativeTab(node) {
        if (!node.exists) {
          els.inspectorBody.appendChild(
            el("div", "empty-note", `${node.file} does not exist yet.`)
          );
          return;
        }

        const cached = state.artifactCache.get(node.phase);
        if (cached && cached.mtimeMs === node.mtime_ms) {
          if (!cached.data.narrative_markdown) {
            els.inspectorBody.appendChild(el("div", "empty-note", "No narrative markdown content found."));
          } else {
            els.inspectorBody.appendChild(renderSafeMarkdown(cached.data.narrative_markdown));
          }
          return;
        }

        const loading = el("div", "empty-note", `Loading ${node.file}…`);
        els.inspectorBody.appendChild(loading);

        try {
          const resp = await fetch(`/api/artifact/${encodeURIComponent(node.phase)}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          state.artifactCache.set(node.phase, { mtimeMs: node.mtime_ms, data });
          if (state.selectedPhase === node.phase && state.activeTab === "narrative") {
            const prevScroll = els.inspectorBody.scrollTop;
            els.inspectorBody.textContent = "";
            if (!data.narrative_markdown) {
              els.inspectorBody.appendChild(el("div", "empty-note", "No narrative markdown content found."));
            } else {
              els.inspectorBody.appendChild(renderSafeMarkdown(data.narrative_markdown));
            }
            els.inspectorBody.scrollTop = prevScroll;
          }
        } catch (err) {
          if (state.selectedPhase === node.phase && state.activeTab === "narrative") {
            els.inspectorBody.textContent = "";
            els.inspectorBody.appendChild(
              el("div", "alert-card alert-error", `Failed to load artifact narrative: ${err.message}`)
            );
          }
        }
      }

      function renderReviewsTab(node) {
        if (!node.reviews || node.reviews.length === 0) {
          els.inspectorBody.appendChild(
            el("div", "empty-note", `No sf-review audit files found targeting "${node.phase}" under docs/factory/reviews/.`)
          );
          return;
        }

        for (const rev of node.reviews) {
          const card = el("div", "review-card");
          const head = el("div", "review-card-head");
          const filename = rev.file.split("/").pop();
          head.appendChild(el("strong", "inspector-sub", filename));

          const badges = el("div", "node-badges");
          badges.appendChild(
            el("span", `badge ${rev.verdict === "PASS" ? "badge-pass" : "badge-fail"}`, rev.verdict)
          );
          badges.appendChild(
            el("span", `badge ${rev.is_stale ? "badge-stale" : "badge-neutral"}`, rev.is_stale ? "STALE REVIEW" : "FRESH")
          );
          head.appendChild(badges);
          card.appendChild(head);

          const meta = el("div", "review-meta-row");
          meta.appendChild(el("span", "", `Sources: ${rev.source_phases.join(", ") || "none"}`));
          meta.appendChild(el("span", "", `Critical: ${rev.critical_violations_count}`));
          meta.appendChild(el("span", "", `Scope warnings: ${rev.scope_creep_warnings_count}`));
          card.appendChild(meta);

          if (rev.is_stale && rev.stale_reasons.length > 0) {
            const staleBox = el("div", "alert-card alert-stale");
            const ul = el("ul");
            rev.stale_reasons.forEach((r) => ul.appendChild(el("li", "", r)));
            staleBox.appendChild(ul);
            card.appendChild(staleBox);
          }

          if (rev.blocking_issues && rev.blocking_issues.length > 0) {
            const blkBox = el("div", "alert-card alert-error");
            blkBox.appendChild(el("h4", "", "Blocking Issues"));
            const ul = el("ul");
            rev.blocking_issues.forEach((b) => ul.appendChild(el("li", "", b)));
            blkBox.appendChild(ul);
            card.appendChild(blkBox);
          }

          // Toggleable full review narrative
          const isExpanded = state.expandedReviews.has(filename);
          const toggleBtn = el("button", "btn", isExpanded ? "Hide Audit Narrative" : "View Audit Narrative");
          toggleBtn.type = "button";
          const narrativeHost = el("div");

          toggleBtn.addEventListener("click", async () => {
            if (state.expandedReviews.has(filename)) {
              state.expandedReviews.delete(filename);
              toggleBtn.textContent = "View Audit Narrative";
              narrativeHost.textContent = "";
              return;
            }
            state.expandedReviews.add(filename);
            toggleBtn.textContent = "Hide Audit Narrative";
            await loadReviewNarrative(filename, rev.mtime_ms, narrativeHost);
          });

          card.appendChild(toggleBtn);
          card.appendChild(narrativeHost);

          if (isExpanded) {
            loadReviewNarrative(filename, rev.mtime_ms, narrativeHost);
          }

          els.inspectorBody.appendChild(card);
        }
      }

      async function loadReviewNarrative(filename, mtimeMs, host) {
        const cached = state.reviewCache.get(filename);
        if (cached && cached.mtimeMs === mtimeMs) {
          host.textContent = "";
          host.appendChild(renderSafeMarkdown(cached.data.narrative_markdown));
          return;
        }
        host.textContent = "";
        host.appendChild(el("div", "empty-note", "Loading review…"));
        try {
          const resp = await fetch(`/api/review/${encodeURIComponent(filename)}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          state.reviewCache.set(filename, { mtimeMs, data });
          host.textContent = "";
          host.appendChild(renderSafeMarkdown(data.narrative_markdown));
        } catch (err) {
          host.textContent = "";
          host.appendChild(el("div", "alert-card alert-error", `Failed to load review: ${err.message}`));
        }
      }

      function applyGraph(nextGraph) {
        const isFirst = !state.graph;
        state.graph = nextGraph;

        if (!state.selectedPhase) {
          // Pick first actionable node or vision
          const pick =
            nextGraph.nodes.find((n) => n.status === "invalid" || n.status === "reviewed_fail") ||
            nextGraph.nodes.find((n) => n.is_stale) ||
            nextGraph.nodes.find((n) => n.status === "unlocked") ||
            nextGraph.nodes[0];
          state.selectedPhase = pick ? pick.phase : null;
        }

        renderSummary();
        renderDag();
        renderInspector({ preserveScroll: !isFirst });

        if (isFirst) {
          fitZoom();
        }
      }

      function fitZoom() {
        const stageW = parseFloat(els.dagStage.style.width) || 1800;
        const availW = els.canvasScroller.clientWidth - 48;
        if (availW > 0 && stageW > 0) {
          const ratio = Math.min(1, Math.max(0.45, availW / stageW));
          state.zoom = Math.round(ratio * 100) / 100;
          els.dagStage.style.transform = `scale(${state.zoom})`;
        }
      }

      // Wire controls
      els.btnMockery.addEventListener("click", () => {
        state.showMockery = !state.showMockery;
        els.btnMockery.setAttribute("aria-pressed", String(state.showMockery));
        els.btnMockery.classList.toggle("active-toggle", state.showMockery);
        if (!state.showMockery && state.selectedPhase === "mockery") {
          state.selectedPhase = "ui";
        }
        renderDag();
        renderInspector({ preserveScroll: false });
      });

      els.btnBlast.addEventListener("click", () => {
        state.highlightBlast = !state.highlightBlast;
        els.btnBlast.setAttribute("aria-pressed", String(state.highlightBlast));
        els.btnBlast.classList.toggle("active-blast", state.highlightBlast);
        renderDag();
      });

      document.getElementById("btn-zoom-in").addEventListener("click", () => {
        state.zoom = Math.min(1.4, Math.round((state.zoom + 0.1) * 100) / 100);
        els.dagStage.style.transform = `scale(${state.zoom})`;
      });
      document.getElementById("btn-zoom-out").addEventListener("click", () => {
        state.zoom = Math.max(0.4, Math.round((state.zoom - 0.1) * 100) / 100);
        els.dagStage.style.transform = `scale(${state.zoom})`;
      });
      document.getElementById("btn-zoom-reset").addEventListener("click", () => {
        state.zoom = 1;
        els.dagStage.style.transform = "scale(1)";
      });
      document.getElementById("btn-zoom-fit").addEventListener("click", fitZoom);

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.getAttribute("data-tab");
          document.querySelectorAll(".tab-btn").forEach((b) => {
            const active = b === btn;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", String(active));
          });
          renderInspector({ preserveScroll: false });
        });
      });

      function setSseStatus(status, label) {
        els.ssePill.setAttribute("data-state", status);
        els.sseLabel.textContent = label;
      }

      function connectSse() {
        const es = new EventSource("/events");
        es.onopen = () => setSseStatus("connected", "Live");
        es.addEventListener("graph", (ev) => {
          setSseStatus("connected", "Live");
          try {
            applyGraph(JSON.parse(ev.data));
          } catch {}
        });
        es.onerror = () => {
          setSseStatus("reconnecting", "Reconnecting…");
        };
      }

      async function bootstrap() {
        initTheme();
        try {
          const resp = await fetch("/api/graph");
          if (resp.ok) {
            applyGraph(await resp.json());
          }
        } catch {}
        connectSse();
      }

      bootstrap();
    })();
  </script>
</body>
</html>
